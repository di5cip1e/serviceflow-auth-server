<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAIKR - Chat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="chat-window" role="region" aria-label="Chat">
    <div class="chat-header">
      <div class="avatar">A</div>
      <strong>Agent A</strong>
      <span style="margin-left:auto; font-size:0.85rem; color:#e2e8f0;">Online</span>
    </div>
    <div class="chat-messages" id="messages">
      <div class="message agent">Hello! How can I help you today?</div>
      <div class="message user">I need help with setup.</div>
    </div>
    <div class="chat-input">
      <input type="text" placeholder="Type a message..." style="flex:1;"/>
      <button class="btn btn-primary">Send</button>
    </div>
  </div>
</body>
</html>
