<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Design Challenge - Pink, abstract - 48x48 -->
  <!-- Abstract geometric shapes -->
  <rect x="8" y="8" width="12" height="12" fill="#FF69B4" transform="rotate(15 14 14)"/>
  <rect x="28" y="8" width="12" height="12" fill="#FFB6C1" transform="rotate(-10 34 14)"/>
  <rect x="18" y="24" width="12" height="12" fill="#FF1493" transform="rotate(45 24 30)"/>
  <!-- Color inconsistency - mismatched eyes -->
  <circle cx="14" cy="18" r="3" fill="#FFFFFF"/>
  <circle cx="34" cy="18" r="3" fill="#FFFFFF"/>
  <circle cx="14" cy="18" r="1" fill="#FF69B4"/>
  <circle cx="34" cy="18" r="1" fill="#00CED1"/>
  <!-- Floating design elements -->
  <circle cx="24" cy="8" r="2" fill="#FFD700"/>
  <circle cx="8" cy="28" r="2" fill="#00FF00"/>
  <circle cx="40" cy="32" r="2" fill="#FF4500"/>
  <circle cx="24" cy="40" r="2" fill="#9370DB"/>
</svg>