<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Eldritch - Primary Shadow Council Rune -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b7500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Vertical line -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Horizontal cross -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Diagonal top-left to bottom-right -->
  <line x1="25" y1="25" x2="75" y2="75" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Diagonal top-right to bottom-left -->
  <line x1="75" y1="25" x2="25" y2="75" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Inner triangle -->
  <polygon points="50,30 35,70 65,70" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
</svg>
