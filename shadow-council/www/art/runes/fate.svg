<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fate - Destiny/Weave Rune -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b7500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="45" fill="#0a0a0f" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Weave pattern - vertical -->
  <path d="M50,10 Q30,30 40,50 Q50,70 30,90" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Weave pattern - crossing -->
  <path d="M50,10 Q70,30 60,50 Q50,70 70,90" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Central knot -->
  <circle cx="50" cy="50" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Inner star -->
  <polygon points="50,38 53,48 63,48 55,55 58,65 50,58 42,65 45,55 37,48 47,48" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Top thread -->
  <line x1="50" y1="10" x2="50" y2="42" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Bottom thread -->
  <line x1="50" y1="58" x2="50" y2="90" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Left threads -->
  <line x1="15" y1="35" x2="40" y2="45" stroke="url(#goldGrad)" stroke-width="1"/>
  <line x1="20" y1="65" x2="42" y2="55" stroke="url(#goldGrad)" stroke-width="1"/>
  <!-- Right threads -->
  <line x1="85" y1="35" x2="60" y2="45" stroke="url(#goldGrad)" stroke-width="1"/>
  <line x1="80" y1="65" x2="58" y2="55" stroke="url(#goldGrad)" stroke-width="1"/>
</svg>
