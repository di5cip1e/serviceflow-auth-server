<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Void - Darkness/Abyss Rune -->
  <defs>
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a0080"/>
      <stop offset="100%" style="stop-color:#1a0030"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b7500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark circle background -->
  <circle cx="50" cy="50" r="45" fill="#0a0a0f" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Central eye shape -->
  <ellipse cx="50" cy="50" rx="20" ry="30" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Pupil -->
  <ellipse cx="50" cy="50" rx="8" ry="12" fill="url(#voidGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
  <!-- Top vertical line -->
  <line x1="50" y1="5" x2="50" y2="20" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Bottom vertical line -->
  <line x1="50" y1="80" x2="50" y2="95" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Left horizontal -->
  <line x1="10" y1="50" x2="30" y2="50" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Right horizontal -->
  <line x1="70" y1="50" x2="90" y2="50" stroke="url(#goldGrad)" stroke-width="2"/>
</svg>
