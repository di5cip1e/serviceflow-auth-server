<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 20" width="200" height="20">
  <!-- Decorative Rune Divider -->
  <defs>
    <linearGradient id="divGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b7500"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b7500"/>
    </linearGradient>
    <linearGradient id="divGoldBright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>
  
  <!-- Left line -->
  <line x1="5" y1="10" x2="70" y2="10" stroke="url(#divGoldGrad)" stroke-width="1.5"/>
  
  <!-- Center diamond -->
  <polygon points="100,5 105,10 100,15 95,10" fill="none" stroke="url(#divGoldBright)" stroke-width="1.5"/>
  
  <!-- Inner diamond -->
  <polygon points="100,8 103,10 100,12 97,10" fill="url(#divGoldBright)"/>
  
  <!-- Right line -->
  <line x1="130" y1="10" x2="195" y2="10" stroke="url(#divGoldGrad)" stroke-width="1.5"/>
  
  <!-- Decorative dots left -->
  <circle cx="80" cy="10" r="1.5" fill="url(#divGoldGrad)"/>
  <circle cx="85" cy="10" r="1" fill="url(#divGoldGrad)" opacity="0.7"/>
  
  <!-- Decorative dots right -->
  <circle cx="115" cy="10" r="1.5" fill="url(#divGoldGrad)"/>
  <circle cx="120" cy="10" r="1" fill="url(#divGoldGrad)" opacity="0.7"/>
</svg>
