<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dominion - Power/Rule Rune -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#8b7500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer hexagon -->
  <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="#0a0a0f" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Inner hexagon -->
  <polygon points="50,20 75,35 75,65 50,80 25,65 25,35" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Central vertical -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Crown top -->
  <path d="M40,15 L50,5 L60,15" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Horizontal crossbar -->
  <line x1="30" y1="45" x2="70" y2="45" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="30" y1="55" x2="70" y2="55" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Diagonal accents -->
  <line x1="25" y1="35" x2="40" y2="45" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="75" y1="35" x2="60" y2="45" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="25" y1="65" x2="40" y2="55" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="75" y1="65" x2="60" y2="55" stroke="url(#goldGrad)" stroke-width="1.5"/>
</svg>
