<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" preserveAspectRatio="xMidYMid slice">
  <!-- Dark Stone Tile Background -->
  <defs>
    <linearGradient id="stoneGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </linearGradient>
    <filter id="stoneNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" result="desaturated"/>
      <feBlend in="SourceGraphic" in2="desaturated" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Base dark color -->
  <rect width="64" height="64" fill="url(#stoneGrad1)"/>
  
  <!-- Stone tile pattern -->
  <rect x="0" y="0" width="30" height="30" fill="#15151e" stroke="#252530" stroke-width="0.5" rx="1"/>
  <rect x="32" y="0" width="32" height="30" fill="#12121a" stroke="#252530" stroke-width="0.5" rx="1"/>
  <rect x="0" y="32" width="32" height="32" fill="#12121a" stroke="#252530" stroke-width="0.5" rx="1"/>
  <rect x="34" y="34" width="30" height="30" fill="#15151e" stroke="#252530" stroke-width="0.5" rx="1"/>
  
  <!-- Subtle texture overlay -->
  <circle cx="15" cy="15" r="8" fill="#1e1e2a" opacity="0.3"/>
  <circle cx="48" cy="15" r="10" fill="#1a1a26" opacity="0.3"/>
  <circle cx="15" cy="48" r="12" fill="#1a1a26" opacity="0.3"/>
  <circle cx="50" cy="50" r="8" fill="#1e1e2a" opacity="0.3"/>
  
  <!-- Edge darkening -->
  <rect x="0" y="0" width="64" height="2" fill="#050508" opacity="0.5"/>
  <rect x="0" y="62" width="64" height="2" fill="#050508" opacity="0.5"/>
  <rect x="0" y="0" width="2" height="64" fill="#050508" opacity="0.5"/>
  <rect x="62" y="0" width="2" height="64" fill="#050508" opacity="0.5"/>
</svg>
