<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Round Table — cmdcntr.online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --v:#0A0A0F;--g:#1A1A2E;--s:#2D2D44;--a:#C0A060;--c:#804020;
  --b:#0040A0;--p:#00C0FF;--t:#E0E0E0;--d:#666;--on:#00E676;--bu:#FFB300;--id:#78909C;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--v);color:var(--t);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.o{font-family:'Orbitron',sansaverif}

/* HEADER */
.hd{text-align:center;padding:18px 16px 10px;border-bottom:1px solid var(--s);position:relative}
.hd h1{font-size:1.4rem;letter-spacing:4px;background:linear-gradient(135deg,var(--a),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hd .sub{font-size:.65rem;color:var(--d);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.badge{position:absolute;top:14px;right:14px;padding:5px 12px;border-radius:16px;font-size:.6rem;font-weight:600;cursor:pointer;border:1px solid var(--s);background:var(--g);color:var(--d);transition:all .3s}
.badge.on{background:linear-gradient(135deg,#C0A06022,#80402222);border-color:var(--a);color:var(--a);animation:pb 2s ease-in-out infinite}
@keyframes pb{0%,100%{box-shadow:0 0 6px #C0A06033}50%{box-shadow:0 0 18px #C0A06066}}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 370px;height:calc(100vh - 72px)}

/* TABLE */
.tc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:hidden;position:relative}
.ring{width:400px;height:400px;border-radius:50%;border:2px solid var(--s);position:relative;background:radial-gradient(circle,#1A1A2E88 0%,#0A0A0F00 70%);box-shadow:0 0 50px #C0A06018,inset 0 0 50px #C0A06008}
.rc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2}
.rc .lbl{font-size:.55rem;letter-spacing:3px;color:var(--a);text-transform:uppercase}
.rc .topic{font-size:.8rem;margin-top:4px;max-width:180px}

.seat{position:absolute;width:130px;text-align:center;z-index:3;transition:all .5s}
.seat .av{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:3px solid var(--s);position:relative;transition:all .3s}
.seat .av .dot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;border:2px solid var(--v)}
.seat .nm{font-size:.65rem;letter-spacing:1px}
.seat .al{font-size:.58rem;color:var(--d);margin-top:1px}
.seat .tk{font-size:.55rem;color:var(--p);margin-top:3px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.seat[data-agent=director]{top:-46px;left:50%;transform:translateX(-50%)}
.seat[data-agent=hermes]{bottom:16px;left:6px}
.seat[data-agent=enlillian]{bottom:16px;right:6px}
.seat.on .av{border-color:var(--on);box-shadow:0 0 14px #00E67633}
.seat.bu .av{border-color:var(--bu);box-shadow:0 0 14px #FFB30033}
.seat.id .av{border-color:var(--id)}

/* SIDE PANEL */
.sp{border-left:1px solid var(--s);display:flex;flex-direction:column;background:#0E0E14}
.tabs{display:flex;border-bottom:1px solid var(--s)}
.tabs .tab{flex:1;padding:9px 4px;text-align:center;font-size:.55rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--d);border-bottom:2px solid transparent;transition:all .2s}
.tabs .tab.active{color:var(--a);border-bottom-color:var(--a)}
.pc{flex:1;overflow-y:auto;padding:10px}
.pc::-webkit-scrollbar{width:3px}
.pc::-webkit-scrollbar-thumb{background:var(--s);border-radius:2px}

/* CARDS */
.card{background:var(--g);border:1px solid var(--s);border-radius:8px;padding:10px;margin-bottom:8px}
.card:hover{border-color:#C0A06033}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ca{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;border:2px solid var(--s)}
.cn{font-size:.65rem;letter-spacing:1px}
.cs{font-size:.5rem;padding:1px 7px;border-radius:8px;margin-left:auto;text-transform:uppercase;font-weight:600}
.cs.on{background:#00E67618;color:var(--on)}.cs.bu{background:#FFB30018;color:var(--bu)}.cs.id{background:#78909C18;color:var(--id)}
.sl{font-size:.5rem;text-transform:uppercase;letter-spacing:1px;color:var(--d);margin:6px 0 3px}
.ti{font-size:.65rem;padding:3px 0;border-bottom:1px solid #ffffff08;display:flex;align-items:center;gap:5px}
.ti .dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.ti .tm{font-size:.5rem;color:var(--d);margin-left:auto;white-space:nowrap}

/* MESSAGES */
.msg{padding:7px;margin-bottom:5px;border-radius:6px;font-size:.65rem;line-height:1.4;background:var(--g);border-left:3px solid var(--s)}
.msg .from{font-weight:700;font-size:.6rem;margin-bottom:1px}
.msg .to{font-size:.5rem;color:var(--d)}
.msg .tm{float:right;font-size:.5rem;color:var(--d)}

/* COMPOSER */
.comp{padding:8px;border-top:1px solid var(--s);display:flex;flex-direction:column;gap:5px}
.comp select,.comp input{background:var(--g);border:1px solid var(--s);color:var(--t);padding:6px 8px;border-radius:5px;font-size:.65rem;outline:none}
.comp select:focus,.comp input:focus{border-color:var(--a)}
.comp button{background:linear-gradient(135deg,var(--a),var(--c));color:#fff;border:none;padding:7px;border-radius:5px;font-weight:700;font-size:.6rem;cursor:pointer;letter-spacing:1px;text-transform:uppercase}

/* FILE VIEWER */
.fv{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center}
.fv.show{display:flex}
.fv-inner{background:var(--g);border:1px solid var(--s);border-radius:10px;width:82vw;height:82vh;display:flex;flex-direction:column;overflow:hidden}
.fv-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--s)}
.fv-hd .title{font-size:.75rem;font-weight:600;color:var(--a)}
.fv-hd .close{cursor:pointer;font-size:1.1rem;color:var(--d)}
.fv-bd{flex:1;overflow:auto;padding:14px}
.fv-bd pre{font-family:monospace;font-size:.7rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}

/* GOALS */
.goal-card{background:var(--g);border:1px solid var(--s);border-radius:8px;padding:12px;margin-bottom:10px}
.goal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.goal-title{font-size:.75rem;font-weight:600;color:var(--a)}
.goal-status{font-size:.5rem;padding:2px 8px;border-radius:8px;text-transform:uppercase;font-weight:600}
.goal-status.active{background:#00E67618;color:var(--on)}
.goal-status.completed{background:#00C0FF18;color:var(--p)}
.goal-status.blocked{background:#FF525218;color:#FF5252}
.goal-status.paused{background:#78909C18;color:var(--id)}
.progress-bg{background:var(--s);border-radius:4px;height:6px;margin:6px 0 4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s;background:linear-gradient(90deg,var(--a),var(--p))}
.goal-numbers{font-size:.55rem;color:var(--d);display:flex;justify-content:space-between}
.milestone-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:.65rem;border-bottom:1px solid #ffffff08}
.milestone-check{width:13px;height:13px;accent-color:var(--a);cursor:pointer;flex-shrink:0}
.milestone-text{flex:1}.milestone-text.done{text-decoration:line-through;opacity:.5}
.goal-assignee{font-size:.55rem;color:var(--d);margin-top:4px}

/* WAR MAP */
.wm-section{margin-bottom:14px}
.wm-phase{background:var(--g);border:1px solid var(--s);border-radius:8px;margin-bottom:8px;overflow:hidden}
.wm-phase-header{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none}
.wm-phase-header:hover{background:#ffffff06}
.wm-phase-icon{font-size:.8rem;transition:transform .2s}
.wm-phase-icon.open{transform:rotate(90deg)}
.wm-phase-num{font-size:.55rem;color:var(--a);font-weight:700;min-width:20px}
.wm-phase-name{font-size:.7rem;font-weight:600;flex:1}
.wm-phase-status{font-size:.5rem;padding:1px 7px;border-radius:7px;text-transform:uppercase;font-weight:600}
.wm-phase-status.pending{background:#78909C18;color:var(--id)}
.wm-phase-status.active{background:#FFB30018;color:var(--bu)}
.wm-phase-status.completed{background:#00E67618;color:var(--on)}
.wm-phase-status.blocked{background:#FF525218;color:#FF5252}
.wm-phase-stats{font-size:.5rem;color:var(--d)}
.wm-phase-body{padding:0 10px 10px;border-top:1px solid var(--s)}
.wm-phase-body.hidden{display:none}
.wm-step{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:.65rem;border-bottom:1px solid #ffffff06}
.wm-step-check{width:12px;height:12px;accent-color:var(--bu);cursor:pointer;flex-shrink:0}
.wm-step-text{flex:1}.wm-step-text.done{text-decoration:line-through;opacity:.5}
.add-step-row,.add-milestone-row{display:flex;gap:5px;margin-top:6px}
.add-step-row input,.add-milestone-row input{flex:1;background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px 8px;border-radius:5px;font-size:.6rem;outline:none}
.add-step-row button,.add-milestone-row button{background:var(--s);color:var(--t);border:none;padding:5px 10px;border-radius:5px;font-size:.6rem;cursor:pointer}

/* AGENT SELECTOR DROPDOWN */
.agent-picker{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.agent-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:.55rem;font-weight:600;border:1px solid var(--s);cursor:pointer;transition:all .2s;user-select:none}
.agent-chip:hover{border-color:var(--a)}
.agent-chip.sel{border-color:var(--a);background:#C0A06018;color:var(--a)}
.agent-chip .x{margin-left:2px;font-size:.7rem;opacity:.6}.agent-chip .x:hover{opacity:1}
.agent-dd-wrap{position:relative}
.agent-dd-btn{background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px 10px;border-radius:5px;font-size:.6rem;cursor:pointer;width:100%;text-align:left}
.agent-dd-btn:hover{border-color:var(--a)}
.agent-dd-menu{position:absolute;top:100%;left:0;right:0;background:var(--g);border:1px solid var(--s);border-radius:6px;z-index:50;max-height:160px;overflow-y:auto;display:none}
.agent-dd-menu.show{display:block}
.agent-dd-item{padding:6px 10px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.agent-dd-item:hover{background:#ffffff0d}
.agent-dd-item.disabled{opacity:.35;pointer-events:none}

/* BUTTONS */
.btn{background:linear-gradient(135deg,var(--a),var(--c));color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:.6rem;font-weight:700;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
.btn:hover{opacity:.88}
.btn-sec{background:var(--g);border:1px solid var(--s);color:var(--t);padding:6px 12px;border-radius:6px;font-size:.6rem;cursor:pointer}
.btn-sec:hover{border-color:var(--a)}
.btn-row{display:flex;gap:6px;margin-top:8px}

/* ANIM */
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .35s ease}

@media(max-width:800px){
  .main{grid-template-columns:1fr;grid-template-rows:40vh auto}
  .ring{width:240px;height:240px}
  .seat{width:85px}
  .seat .av{width:40px;height:40px;font-size:1rem}
  .sp{border-left:none;border-top:1px solid var(--s)}
}
</style>
</head>
<body>

<div class="hd">
  <h1>⚔️ THE ROUND TABLE</h1>
  <div class="sub">Agent Command Center — Real-Time Coordination</div>
  <div class="badge" id="badge" onclick="toggleRT()">⏸ Round Table Idle</div>
</div>

<div class="main">
  <div class="tc">
    <div class="ring" id="ring">
      <div class="rc">
        <div class="lbl">⚔ Round Table</div>
        <div class="topic" id="topic">Awaiting orders</div>
      </div>
    </div>
  </div>
  <div class="sp">
    <div class="tabs">
      <div class="tab active" onclick="sw('status',this)">📊 Status</div>
      <div class="tab" onclick="sw('comms',this)">💬 Comms</div>
      <div class="tab" onclick="sw('projects',this)">📁 Projects</div>
      <div class="tab" onclick="sw('history',this)">📋 History</div>
    </div>
    <div class="pc" id="pc"></div>
    <div class="comp" id="comp">
      <select id="mf"><option value="derek">🎯 Derek</option><option value="director">🎬 Director</option><option value="hermes">⚡ V</option><option value="enlillian">🦉 OWL</option></select>
      <select id="mt"><option value="all">📢 All</option><option value="derek">🎯 Derek</option><option value="director">🎬 Director</option><option value="hermes">⚡ V</option><option value="enlillian">🦉 OWL</option></select>
      <input type="text" id="mx" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">Send ↗</button>
    </div>
  </div>
</div>

<!-- FILE VIEWER -->
<div class="fv" id="fv" onclick="if(event.target===this)closeFV()">
  <div class="fv-inner">
    <div class="fv-hd"><span class="title" id="fvT">File</span><span class="close" onclick="closeFV()">✕</span></div>
    <div class="fv-bd"><pre id="fvC">Loading...</pre></div>
  </div>
</div>

<script>
const M={director:{e:'🎬',n:'The Director',a:'Director',c:'#C0A060'},hermes:{e:'⚡',n:'Hermes',a:'V',c:'#0040A0'},enlillian:{e:'🦉',n:'Enlillian',a:'OWL',c:'#804020'},derek:{e:'🎯',n:'Derek',a:'Admin',c:'#00C0FF'}};
const AGENTS=['director','hermes','enlillian'];
let state=null,ws=null,curTab='status',rtOn=false,curProj=null,openPhases={};

// WS
function connect(){
  const p=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${p}://${location.host}`);
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==='init'){state=d.state;renderAll()}
    else if(d.type==='agentUpdate'){state.agents[d.agentId]=d.agent;renderAll()}
    else if(d.type==='newMessage'){state.messages.push(d.message);if(curTab==='comms')renderComms()}
    else if(d.type==='roundTableStart'){state.roundTable=d.roundTable;updateBadge()}
    else if(d.type==='roundTableEnd'){state.roundTable={active:false,topic:null,startedAt:null};updateBadge()}
    else if(d.type==='projectUpdate'){state.projects[d.projectId]=d.project;if(curTab==='projects')renderProjects()}
    else if(d.type==='projectDelete'){delete state.projects[d.projectId];if(curTab==='projects')renderProjects()}
    else if(d.type==='taskUpdate'){const t=(state.tasks[d.projectId]=state.tasks[d.projectId]||[]);const i=t.findIndex(x=>x.id===d.task.id);if(i>=0)t[i]=d.task;else t.push(d.task);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='taskDelete'){if(state.tasks[d.projectId])state.tasks[d.projectId]=state.tasks[d.projectId].filter(x=>x.id!==d.taskId);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='fileUpdate'){const f=(state.files[d.projectId]=state.files[d.projectId]||[]);f.push(d.file);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='goalUpdate'){const g=(state.goals[d.projectId]=state.goals[d.projectId]||[]);const i=g.findIndex(x=>x.id===d.goal.id);if(i>=0)g[i]=d.goal;else g.push(d.goal);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='goalDelete'){if(state.goals[d.projectId])state.goals[d.projectId]=state.goals[d.projectId].filter(x=>x.id!==d.goalId);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='warMapUpdate'){const wm=(state.warMaps[d.projectId]=state.warMaps[d.projectId]||{phases:[]});const i=wm.phases.findIndex(x=>x.id===d.phase.id);if(i>=0)wm.phases[i]=d.phase;else wm.phases.push(d.phase);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='warMapStepUpdate'){const wm=(state.warMaps[d.projectId]=state.warMaps[d.projectId]||{phases:[]});const ph=wm.phases.find(x=>x.id===d.phaseId);if(ph){const i=ph.steps.findIndex(x=>x.id===d.step.id);if(i>=0)ph.steps[i]=d.step;else ph.steps.push(d.step)}if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='warMapPhaseDelete'){const wm=(state.warMaps[d.projectId]=state.warMaps[d.projectId]||{phases:[]});wm.phases=wm.phases.filter(x=>x.id!==d.phaseId);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
    else if(d.type==='warMapStepDelete'){const wm=(state.warMaps[d.projectId]=state.warMaps[d.projectId]||{phases:[]});const ph=wm.phases.find(x=>x.id===d.phaseId);if(ph)ph.steps=ph.steps.filter(x=>x.id!==d.stepId);if(curTab==='projects'&&curProj===d.projectId)renderProjDetail(d.projectId)}
  };
  ws.onclose=()=>setTimeout(connect,3000);
}

function renderAll(){if(!state)return;renderTable();renderPanel();updateBadge()}

function renderTable(){
  const r=document.getElementById('ring');
  r.querySelectorAll('.seat').forEach(e=>e.remove());
  AGENTS.forEach(id=>{
    const a=state.agents[id];if(!a)return;
    const m=M[id];
    const s=document.createElement('div');
    s.className=`seat ${a.status||'id'} fi`;
    s.setAttribute('data-agent',id);
    s.innerHTML=`<div class="av" style="border-color:${m.c}">${m.e}<div class="dot" style="background:${sc(a.status)}"></div></div>
      <div class="nm" style="color:${m.c}">${a.alias||m.a}</div>
      <div class="al">${m.n}</div>
      ${a.currentTask?`<div class="tk">⚙ ${a.currentTask}</div>`:''}`;
    r.appendChild(s);
  });
  document.getElementById('topic').textContent=state.roundTable?.active?`🟢 ${state.roundTable.topic}`:'Awaiting orders';
}

function renderPanel(){
  if(curTab==='status')renderStatus();
  else if(curTab==='comms')renderComms();
  else if(curTab==='projects')renderProjects();
  else if(curTab==='history')renderHistory();
}

// STATUS
function renderStatus(){
  let h='';
  AGENTS.forEach(id=>{
    const a=state.agents[id];if(!a)return;
    const m=M[id];
    h+=`<div class="card fi"><div class="ch"><div class="ca" style="border-color:${m.c}">${m.e}</div><div><div class="cn" style="color:${m.c}">${a.alias||m.a}</div><div style="font-size:.55rem;color:var(--d)">${m.n}</div></div><span class="cs ${a.status||'id'}">${a.status||'idle'}</span></div>
      ${a.currentTask?`<div class="sl">⚙ Current</div><div class="ti"><span class="dot" style="background:var(--bu)"></span>${a.currentTask}</div>`:''}
      ${a.planned?.length?`<div class="sl">📋 Planned</div>${a.planned.slice(0,5).map(t=>`<div class="ti"><span class="dot" style="background:var(--p)"></span>${typeof t==='string'?t:t.task}<span class="tm">${ta(typeof t==='string'?'':t.at)}</span></div>`).join('')}`:''}
      ${a.done?.length?`<div class="sl">✅ Done</div>${a.done.slice(0,5).map(t=>`<div class="ti"><span class="dot" style="background:var(--on)"></span>${typeof t==='string'?t:t.task}<span class="tm">${ta(typeof t==='string'?'':t.at)}</span></div>`).join('')}`:''}
    </div>`;
  });
  document.getElementById('pc').innerHTML=h||'<div style="color:var(--d);text-align:center;padding:30px">No agents</div>';
}

// COMMS
function renderComms(){
  const msgs=(state.messages||[]).slice(-60).reverse();
  if(!msgs.length){document.getElementById('pc').innerHTML='<div style="color:var(--d);text-align:center;padding:30px">No messages yet</div>';return}
  document.getElementById('pc').innerHTML=msgs.map(m=>{
    const f=M[m.from]||{e:'❓',n:m.from,c:'#888'};
    const t=M[m.to]||(m.to==='all'?{e:'📢',n:'All'}:{e:'❓',n:m.to});
    return`<div class="msg fi" style="border-left-color:${f.c}"><span class="tm">${ft(m.at)}</span><div class="from" style="color:${f.c}">${f.e} ${f.name}</div><div class="to">to ${t.e} ${t.name}</div><div style="margin-top:3px">${eh(m.text)}</div></div>`;
  }).join('');
}

// PROJECTS
function renderProjects(){
  const projs=state.projects||{};
  const keys=Object.keys(projs);
  let h=`<button class="btn" style="width:100%;margin-bottom:10px" onclick="showNewProj()">+ New Project</button>`;
  if(!keys.length)h+='<div style="color:var(--d);text-align:center;padding:24px">No projects yet</div>';
  keys.forEach(pid=>{
    const p=projs[pid];const tasks=(state.tasks[pid]||[]);const files=(state.files[pid]||[]);
    const goals=(state.goals[pid]||[]);const wm=state.warMaps[pid]||{phases:[]};
    const done=tasks.filter(t=>t.done).length;
    h+=`<div class="card fi" style="cursor:pointer" onclick="renderProjDetail('${pid}')">
      <div class="ch"><div style="font-size:1rem">📁</div><div><div class="cn" style="color:var(--a)">${eh(p.name)}</div><div style="font-size:.55rem;color:var(--d)">${eh(p.description||'')}</div></div><span class="cs ${p.status==='active'?'on':'id'}">${p.status||'active'}</span></div>
      <div style="display:flex;gap:10px;margin-top:5px;font-size:.55rem;color:var(--d)">
        <span>📋 ${done}/${tasks.length}</span><span>🎯 ${goals.length} goals</span><span>⚔ ${wm.phases.length} phases</span><span>📄 ${files.length}</span>
      </div></div>`;
  });
  document.getElementById('pc').innerHTML=h;curProj=null;
}

function renderProjDetail(pid){
  curProj=pid;const p=state.projects[pid];if(!p)return;
  const tasks=state.tasks[pid]||[];const files=state.files[pid]||[];
  const goals=state.goals[pid]||[];const wm=state.warMaps[pid]||{phases:[]};
  let h=`<div class="fi">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="btn-sec" onclick="renderProjects()">← Back</button>
      <div class="cn" style="color:var(--a);font-size:.85rem">${eh(p.name)}</div>
    </div>
    <div style="font-size:.6rem;color:var(--d);margin-bottom:12px">${eh(p.description||'')}</div>`;

  // TABS within project
  h+=`<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap">
    <button class="btn-sec" onclick="renderProjDetail('${pid}')" id="ptab-tasks" style="border-color:var(--a);color:var(--a)">📋 Tasks</button>
    <button class="btn-sec" onclick="renderProjGoals('${pid}')" id="ptab-goals">🎯 Goals</button>
    <button class="btn-sec" onclick="renderProjWarMap('${pid}')" id="ptab-warmap">⚔ War Map</button>
    <button class="btn-sec" onclick="renderProjFiles('${pid}')" id="ptab-files">📄 Files</button>
  </div>`;

  // Default: show tasks
  h+=renderTasksHTML(pid,tasks);
  h+=`</div>`;
  document.getElementById('pc').innerHTML=h;
}

function renderTasksHTML(pid,tasks){
  let h=`<div class="sl">📋 Tasks (${tasks.filter(t=>t.done).length}/${tasks.length})</div>`;
  if(!tasks.length)h+=`<div style="color:var(--d);font-size:.6rem;padding:4px 0 8px">No tasks yet</div>`;
  tasks.forEach(t=>{
    h+=`<div class="ti"><input type="checkbox" class="milestone-check" ${t.done?'checked':''} onchange="toggleTask('${pid}','${t.id}',this.checked)"><span class="milestone-text ${t.done?'done':''}">${eh(t.text)}</span><span class="tm">${t.agent?M[t.agent]?.a+': ':''}${ta(t.createdAt)}</span></div>`;
  });
  // Add task with agent dropdown
  h+=`<div class="add-milestone-row">
    <input type="text" id="ntTxt" placeholder="New task..." onkeydown="if(event.key==='Enter')addTask('${pid}')">
    <div class="agent-dd-wrap">
      <button class="agent-dd-btn" id="ntAgentBtn" onclick="toggleDD('ntAgentDD')">👤 Assign</button>
      <div class="agent-dd-menu" id="ntAgentDD">${AGENTS.map(a=>`<div class="agent-dd-item" onclick="pickAgent('ntAgentDD','ntAgentSel','ntAgentBtn','${a}')">${M[a].e} ${M[a].a}</div>`).join('')}<div class="agent-dd-item" onclick="pickAgent('ntAgentDD','ntAgentSel','ntAgentBtn','')">❌ Clear</div></div>
    </div>
    <input type="hidden" id="ntAgentSel" value="">
    <button onclick="addTask('${pid}')">+</button>
  </div>`;
  return h;
}

function renderProjGoals(pid){
  const goals=state.goals[pid]||[];
  let h=`<div class="sl">🎯 Goals (${goals.length})</div>`;
  if(!goals.length)h+=`<div style="color:var(--d);font-size:.6rem;padding:4px 0 8px">No goals yet</div>`;
  goals.forEach(g=>{
    const pct=g.target?Math.round((g.progress/g.target)*100):0;
    const agentChip=g.agent?`<span style="font-size:.5rem;color:${M[g.agent]?.c||'#888'}">${M[g.agent]?.e||''} ${M[g.agent]?.a||g.agent}</span>`:'';
    h+=`<div class="goal-card fi">
      <div class="goal-header"><span class="goal-title">${eh(g.title)}</span><span class="goal-status ${g.status}">${g.status}</span></div>
      ${g.description?`<div style="font-size:.6rem;color:var(--d);margin-bottom:6px">${eh(g.description)}</div>`:''}
      <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="goal-numbers"><span>${g.progress||0}${g.unit||'%'} / ${g.target||100}${g.unit||'%'}</span><span>${pct}%</span></div>
      ${agentChip?`<div class="goal-assignee" style="margin-top:4px">Assigned: ${agentChip}</div>`:''}
      ${g.milestones?.length?`<div class="sl" style="margin-top:8px">Milestones</div>${g.milestones.map(m=>`<div class="milestone-item"><input type="checkbox" class="milestone-check" ${m.done?'checked':''} onchange="toggleMS('${pid}','${g.id}','${m.id}',this.done)"><span class="milestone-text ${m.done?'done':''}">${eh(m.text)}</span></div>`).join('')}`:''}
      <div class="add-milestone-row" style="margin-top:6px">
        <input type="text" id="ms_${g.id}" placeholder="Add milestone..." onkeydown="if(event.key==='Enter')addMS('${pid}','${g.id}')">
        <button onclick="addMS('${pid}','${g.id}')">+</button>
      </div>
    </div>`;
  });
  // New goal
  h+=`<div class="card" style="margin-top:10px">
    <div class="sl">+ New Goal</div>
    <input type="text" id="ngTitle" placeholder="Goal title..." style="width:100%;background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px 8px;border-radius:5px;font-size:.65rem;margin:6px 0;outline:none">
    <input type="text" id="ngDesc" placeholder="Description..." style="width:100%;background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px 8px;border-radius:5px;font-size:.6rem;margin-bottom:6px;outline:none">
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="ngTarget" placeholder="Target" style="width:60px;background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px;border-radius:5px;font-size:.6rem;outline:none">
      <input type="text" id="ngUnit" placeholder="Unit" value="%" style="width:40px;background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px;border-radius:5px;font-size:.6rem;outline:none">
      <div class="agent-dd-wrap">
        <button class="agent-dd-btn" id="ngAgentBtn" onclick="toggleDD('ngAgentDD')" style="font-size:.6rem;padding:5px 8px">👤 Agent</button>
        <div class="agent-dd-menu" id="ngAgentDD">${AGENTS.map(a=>`<div class="agent-dd-item" onclick="pickAgent('ngAgentDD','ngAgentSel','ngAgentBtn','${a}')" style="font-size:.6rem">${M[a].e} ${M[a].a}</div>`).join('')}<div class="agent-dd-item" onclick="pickAgent('ngAgentDD','ngAgentSel','ngAgentBtn','')" style="font-size:.6rem">❌ None</div></div>
      </div>
      <input type="hidden" id="ngAgentSel" value="">
    </div>
    <div class="btn-row"><button class="btn" onclick="addGoal('${pid}')" style="font-size:.55rem;padding:5px 10px">Create Goal</button></div>
  </div>`;
  document.getElementById('pc').innerHTML=h;
}

function renderProjWarMap(pid){
  const wm=state.warMaps[pid]||{phases:[]};
  let h=`<div class="sl">⚔ War Map — Campaign Phases</div>`;
  if(!wm.phases.length)h+=`<div style="color:var(--d);font-size:.6rem;padding:4px 0 8px">No phases yet. Build your campaign below.</div>`;
  wm.phases.sort((a,b)=>a.order-b.order).forEach((ph,idx)=>{
    const isOpen=openPhases[ph.id];
    const doneSteps=ph.steps.filter(s=>s.done).length;
    h+=`<div class="wm-phase fi">
      <div class="wm-phase-header" onclick="togglePhase('${ph.id}')">
        <span class="wm-phase-icon ${isOpen?'open':'}">▶</span>
        <span class="wm-phase-num">P${idx+1}</span>
        <span class="wm-phase-name">${eh(ph.name)}</span>
        <span class="wm-phase-status ${ph.status}">${ph.status}</span>
        <span class="wm-phase-stats">${doneSteps}/${ph.steps.length}</span>
      </div>
      <div class="wm-phase-body ${isOpen?'':'hidden'}" id="phBody_${ph.id}">
        ${ph.description?`<div style="font-size:.6rem;color:var(--d);padding:6px 0">${eh(ph.description)}</div>`:''}
        ${ph.steps.map(s=>`<div class="wm-step"><input type="checkbox" class="wm-step-check" ${s.done?'checked':''} onchange="toggleStep('${pid}','${ph.id}','${s.id}',this.checked)"><span class="wm-step-text ${s.done?'done':''}">${eh(s.text)}</span></div>`).join('')}
        <div class="add-step-row">
          <input type="text" id="ns_${ph.id}" placeholder="Add step..." onkeydown="if(event.key==='Enter')addStep('${pid}','${ph.id}')">
          <button onclick="addStep('${pid}','${ph.id}')">+</button>
        </div>
      </div>
    </div>`;
  });
  // New phase
  h+=`<div class="card" style="margin-top:10px">
    <div class="sl">+ New Phase</div>
    <input type="text" id="npName" placeholder="Phase name (e.g. Reconnaissance)..." style="width:100%;background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px 8px;border-radius:5px;font-size:.65rem;margin:6px 0;outline:none">
    <input type="text" id="npDesc" placeholder="Description..." style="width:100%;background:var(--g);border:1px solid var(--s);color:var(--t);padding:5px 8px;border-radius:5px;font-size:.6rem;margin-bottom:6px;outline:none">
    <div class="agent-dd-wrap" style="margin-bottom:8px">
      <button class="agent-dd-btn" id="npAgentBtn" onclick="toggleDD('npAgentDD')">👤 Assign Agent</button>
      <div class="agent-dd-menu" id="npAgentDD">${AGENTS.map(a=>`<div class="agent-dd-item" onclick="pickAgent('npAgentDD','npAgentSel','npAgentBtn','${a}')">${M[a].e} ${M[a].a}</div>`).join('')}<div class="agent-dd-item" onclick="pickAgent('npAgentDD','npAgentSel','npAgentBtn','')">❌ None</div></div>
    </div>
    <input type="hidden" id="npAgentSel" value="">
    <button class="btn" onclick="addPhase('${pid}')" style="font-size:.55rem;padding:5px 10px">Add Phase</button>
  </div>`;
  document.getElementById('pc').innerHTML=h;
}

function renderProjFiles(pid){
  const files=state.files[pid]||[];
  let h=`<div class="sl">📄 Files (${files.length})</div>`;
  if(!files.length)h+=`<div style="color:var(--d);font-size:.6rem;padding:4px 0 8px">No files yet</div>`;
  files.forEach(f=>{
    h+=`<div class="ti" style="cursor:pointer" onclick="viewFile('${eh(f.path)}','${eh(f.name)}')"><span style="color:var(--p)">📄</span><span style="flex:1">${eh(f.name)}</span><span style="font-size:.5rem;color:var(--d)">${M[f.agent]?.a||f.agent}</span><span class="tm">${ta(f.createdAt)}</span></div>`;
  });
  h+=`<div class="add-milestone-row" style="margin-top:8px">
    <input type="text" id="nfPath" placeholder="File path..." onkeydown="if(event.key==='Enter')regFile('${pid}')">
    <button onclick="regFile('${pid}')">Register</button>
  </div>`;
  document.getElementById('pc').innerHTML=h;
}

// AGENT DROPDOWN
function toggleDD(id){document.getElementById(id).classList.toggle('show')}
function pickAgent(ddId,selId,btnId,val){
  document.getElementById(ddId).classList.remove('show');
  document.getElementById(selId).value=val;
  if(val){const m=M[val];document.getElementById(btnId).textContent=`${m.e} ${m.a}`}
  else{document.getElementById(btnId).textContent='👤 Assign'}
}
// Close dropdowns on outside click
document.addEventListener('click',e=>{
  if(!e.target.closest('.agent-dd-wrap')){
    document.querySelectorAll('.agent-dd-menu').forEach(m=>m.classList.remove('show'));
  }
});

// PHASE TOGGLE
function togglePhase(id){openPhases[id]=!openPhases[id];const b=document.getElementById('phBody_'+id);if(b)b.classList.toggle('hidden');const i=b?.previousElementSibling?.querySelector('.wm-phase-icon');if(i)i.classList.toggle('open')}

// ACTIONS
function showNewProj(){
  const n=prompt('Project name:');if(!n)return;
  const d=prompt('Description:')||'';
  fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,description:d,assignedTo:AGENTS})});
}
function addTask(pid){
  const txt=document.getElementById('ntTxt').value.trim();
  const agent=document.getElementById('ntAgentSel').value||null;
  if(!txt)return;
  fetch(`/api/projects/${pid}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt,agent})});
  document.getElementById('ntTxt').value='';document.getElementById('ntAgentSel').value='';document.getElementById('ntAgentBtn').textContent='👤 Assign';
}
function toggleTask(pid,tid,done){fetch(`/api/projects/${pid}/tasks/${tid}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done})})}
function addGoal(pid){
  const title=document.getElementById('ngTitle').value.trim();
  if(!title)return;
  const desc=document.getElementById('ngDesc').value.trim();
  const target=parseInt(document.getElementById('ngTarget').value)||100;
  const unit=document.getElementById('ngUnit').value.trim()||'%';
  const agent=document.getElementById('ngAgentSel').value||null;
  fetch(`/api/projects/${pid}/goals`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,description:desc,target,unit,agent})});
  document.getElementById('ngTitle').value='';document.getElementById('ngDesc').value='';document.getElementById('ngTarget').value='';document.getElementById('ngAgentSel').value='';document.getElementById('ngAgentBtn').textContent='👤 Agent';
}
function addMS(pid,gid){const txt=document.getElementById('ms_'+gid).value.trim();if(!txt)return;fetch(`/api/projects/${pid}/goals/${gid}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addMilestone:txt})});document.getElementById('ms_'+gid).value=''}
function toggleMS(pid,gid,msid,done){fetch(`/api/projects/${pid}/goals/${gid}/milestones/${msid}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done})})}
function addPhase(pid){
  const name=document.getElementById('npName').value.trim();if(!name)return;
  const desc=document.getElementById('npDesc').value.trim();
  const agent=document.getElementById('npAgentSel').value||null;
  fetch(`/api/projects/${pid}/warmap/phases`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,description:desc,agent})});
  document.getElementById('npName').value='';document.getElementById('npDesc').value='';document.getElementById('npAgentSel').value='';document.getElementById('npAgentBtn').textContent='👤 Assign Agent';
}
function addStep(pid,phid){const txt=document.getElementById('ns_'+phid).value.trim();if(!txt)return;fetch(`/api/projects/${pid}/warmap/phases/${phid}/steps`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt})});document.getElementById('ns_'+phid).value=''}
function toggleStep(pid,phid,sid,done){fetch(`/api/projects/${pid}/warmap/phases/${phid}/steps/${sid}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done})})}
function regFile(pid){const p=document.getElementById('nfPath').value.trim();if(!p)return;const n=p.split('/').pop();fetch(`/api/projects/${pid}/files`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,path:p,agent:'derek'})});document.getElementById('nfPath').value=''}

// HISTORY
function renderHistory(){
  let h='';
  AGENTS.forEach(id=>{const a=state.agents[id];if(!a||!a.done?.length)return;const m=M[id];h+=`<div class="card fi"><div class="ch"><div class="ca" style="border-color:${m.c}">${m.e}</div><div class="cn" style="color:${m.c}">${a.alias||m.a}</div><span style="margin-left:auto;font-size:.5rem;color:var(--d)">${a.done.length} tasks</span></div>${a.done.map(t=>`<div class="ti"><span class="dot" style="background:var(--on)"></span>${typeof t==='string'?t:t.task}<span class="tm">${ta(typeof t==='string'?'':t.at)}</span></div>`).join('')}</div>`});
  document.getElementById('pc').innerHTML=h||'<div style="color:var(--d);text-align:center;padding:30px">No completed tasks</div>';
}

// FILE VIEWER
function viewFile(path,name){document.getElementById('fvT').textContent=name;document.getElementById('fvC').textContent='Loading...';document.getElementById('fv').classList.add('show');fetch(`/api/files/read?path=${encodeURIComponent(path)}`).then(r=>r.json()).then(d=>{document.getElementById('fvC').textContent=d.content||'Empty'}).catch(e=>{document.getElementById('fvC').textContent='Error: '+e})}
function closeFV(){document.getElementById('fv').classList.remove('show')}

// COMMS
async function sendMsg(){const f=document.getElementById('mf').value,t=document.getElementById('mt').value,x=document.getElementById('mx').value.trim();if(!x)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:f,to:t,text:x})});document.getElementById('mx').value=''}
function toggleRT(){if(rtOn)fetch('/api/roundtable/end',{method:'POST'});else{const t=prompt('Topic:','Team Sync');if(t)fetch('/api/roundtable/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:t})})}}
function updateBadge(){const b=document.getElementById('badge');if(state.roundTable?.active){b.textContent=`🟢 ${state.roundTable.topic}`;b.classList.add('on');rtOn=true}else{b.textContent='⏸ Round Table Idle';b.classList.remove('on');rtOn=false}}
function sw(tab,el){curTab=tab;document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderPanel()}

// HELPERS
function sc(s){return s==='online'?'#00E676':s==='busy'?'#FFB300':'#78909C'}
function ta(iso){if(!iso)return'';const df=(Date.now()-new Date(iso).getTime())/1000;if(df<60)return'now';if(df<3600)return`${Math.floor(df/60)}m`;if(df<86400)return`${Math.floor(df/3600)}h`;return`${Math.floor(df/86400)}d`}
function ft(iso){return iso?new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}
function eh(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

connect();
</script>
</body>
</html>
