<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Code Monster - Green blob - 64x64 -->
  <!-- Main body (blob shape) -->
  <ellipse cx="32" cy="36" rx="24" ry="20" fill="#2ECC71"/>
  <ellipse cx="32" cy="36" rx="20" ry="16" fill="#27AE60"/>
  <!-- Floating brackets (code aesthetic) -->
  <text x="12" y="28" font-family="monospace" font-size="20" fill="#2ECC71">&lt;</text>
  <text x="42" y="28" font-family="monospace" font-size="20" fill="#2ECC71">&gt;</text>
  <text x="26" y="52" font-family="monospace" font-size="14" fill="#2ECC71">{}</text>
  <!-- Eyes -->
  <rect x="22" y="30" width="6" height="6" fill="#FFFFFF"/>
  <rect x="36" y="30" width="6" height="6" fill="#FFFFFF"/>
  <rect x="24" y="32" width="2" height="2" fill="#000000"/>
  <rect x="38" y="32" width="2" height="2" fill="#000000"/>
  <!-- Glitch lines -->
  <rect x="16" y="20" width="8" height="2" fill="#5DFF9E"/>
  <rect x="40" y="20" width="8" height="2" fill="#5DFF9E"/>
</svg>