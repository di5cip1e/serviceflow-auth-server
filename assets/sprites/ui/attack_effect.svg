<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Attack Effect - Slash - 48x48 -->
  <!-- Slash trail -->
  <path d="M8,40 Q24,20 40,8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M8,40 Q24,20 40,8" fill="none" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/>
  <!-- Impact flash -->
  <circle cx="32" cy="16" r="8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="32" cy="16" r="4" fill="#4A90D9" opacity="0.8"/>
  <!-- Particle sparks -->
  <rect x="28" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect x="38" y="14" width="2" height="2" fill="#FFFFFF"/>
  <rect x="24" y="12" width="2" height="2" fill="#FFFFFF"/>
</svg>