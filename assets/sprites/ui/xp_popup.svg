<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 24" width="80" height="24">
  <!-- XP Gain Popup - 80x24 -->
  <!-- Background with transparency -->
  <rect x="0" y="0" width="80" height="24" fill="#1a1a2e" rx="4" opacity="0.9"/>
  <!-- Text glow effect -->
  <text x="40" y="16" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">+50 XP</text>
  <!-- Outline/shine -->
  <rect x="0" y="0" width="80" height="24" fill="none" stroke="#FFE066" stroke-width="1" rx="4"/>
</svg>