<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — M.ai.K.R</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/maikr-v3.css">
  <style>
    .auth-card { max-width: 440px; width: 100%; padding: var(--s8); }
    .auth-card h1 { font-size: 1.5rem; margin-bottom: var(--s1); }
    .auth-card .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: var(--s8); }
    .auth-footer { text-align: center; margin-top: var(--s6); font-size: 0.85rem; color: var(--text-dim); }
    .auth-footer a { color: var(--amber); font-weight: 600; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-logo">M<span>.ai</span><span>.K.R</span></a>
    <div class="navbar-links">
      <a href="/pricing.html">Pricing</a>
      <a href="/login.html">Log In</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card card animate-in">
      <h1>Create Your Account</h1>
      <p class="subtitle">Deploy your first AI agent in minutes.</p>

      <div id="registerError" class="alert alert-error hidden" style="margin-bottom:var(--s6)"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your name" required autocomplete="name">
          <div id="nameError" class="form-error"></div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
          <div id="emailError" class="form-error"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
          <div id="passwordError" class="form-error"></div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
          <div id="confirmError" class="form-error"></div>
        </div>
        <button type="submit" class="btn btn-amber btn-lg" style="width:100%" id="registerBtn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Log in →</a>
      </div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var redirectTo = params.get('redirect') || '/command-center.html';

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var name = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var pw = document.getElementById('password').value;
      var cp = document.getElementById('confirmPassword').value;
      
      document.getElementById('registerError').classList.add('hidden');
      ['nameError','emailError','passwordError','confirmError'].forEach(function(id) {
        document.getElementById(id).classList.remove('show');
      });

      var valid = true;
      if (!name) { showErr('nameError', 'Name is required.'); valid = false; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('emailError', 'Valid email required.'); valid = false; }
      if (pw.length < 8) { showErr('passwordError', 'At least 8 characters.'); valid = false; }
      if (pw !== cp) { showErr('confirmError', 'Passwords do not match.'); valid = false; }
      if (!valid) return;

      var btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = 'Creating Account…';

      try {
        var res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name: name, email: email, password: pw })
        });
        var data = await res.json();
        if (res.ok) {
          // Check for saved build data
          var buildData = localStorage.getItem('maikrBuildData');
          if (buildData) {
            window.location.href = '/build';
          } else {
            window.location.href = redirectTo;
          }
        } else {
          document.getElementById('registerError').textContent = data.error || 'Registration failed.';
          document.getElementById('registerError').classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch(e) {
        document.getElementById('registerError').textContent = 'Connection error. Please try again.';
        document.getElementById('registerError').classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });

    function showErr(id, msg) {
      document.getElementById(id).textContent = msg;
      document.getElementById(id).classList.add('show');
    }
  </script>
</body>
</html>
