<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Use Cases — M.ai.K.R</title>
  <meta name="description" content="M.ai.K.R — AI agent teams that qualify leads, answer customers, and close tickets 24/7.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://maikr.pro/build-step3">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.maikr-nav {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  height: 52px;
}
.maikr-logo { font-size: 17px; font-weight: 700; color: #C0A060; text-decoration: none; letter-spacing: -0.5px; }
.maikr-logo span { color: #fff; }
.maikr-links { display: flex; gap: 4px; margin-left: 8px; }
.maikr-links a { color: #8b949e; text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 5px; transition: all 0.15s; }
.maikr-links a:hover { color: #e6edf3; background: #30363d; }
.maikr-links a.active { color: #C0A060; }
.maikr-spacer { flex: 1; }
.maikr-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8b949e; }
.maikr-status .dot { width: 7px; height: 7px; background: #C0A060; border-radius: 50%; box-shadow: 0 0 5px #C0A060; }
}</style>

  <style>
    .skip-link {
      position: absolute; top: -100px; left: 0; z-index: 9999;
      padding: 12px 24px; background: #C0A060; color: #0A0A0F;
      font-weight: 700; font-size: 14px; text-decoration: none;
      border-radius: 0 0 8px 0; transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }
</style>
<style>
/* ── Mobile Breakpoints (≤768px) ── */
@media (max-width: 768px) {

  /* Prevent horizontal overflow */
  html, body { overflow-x: hidden; }

  /* ── Navigation ── */
  .maikr-nav {
    padding: 0 12px;
    gap: 8px;
    height: 48px;
    flex-wrap: nowrap;
  }
  .maikr-logo { font-size: 14px; }
  .maikr-links { gap: 2px; margin-left: 4px; }
  .maikr-links a { font-size: 11px; padding: 4px 6px; }
  .maikr-status { display: none; }

  /* ── Page wrapper / containers ── */
  .page-wrapper {
    padding: 12px;
    width: 100%;
    box-sizing: border-box;
  }

  /* ── Header ── */
  .main-header {
    flex-direction: column;
    gap: 8px;
    padding: 12px 0;
    text-align: center;
  }
  .main-header .logo-text { font-size: 18px; }
  .step-indicator { font-size: 11px; }

  /* ── Form container ── */
  .form-container {
    padding: 16px;
    width: 100%;
    box-sizing: border-box;
  }

  /* ── Step header (headings) ── */
  .step-header h2 { font-size: 20px; }
  .step-header p { font-size: 14px; }

  /* ── Checkbox group ── */
  .checkbox-group { gap: 12px; }
  .checkbox-label { font-size: 13px; }

  /* ── Buttons full-width ── */
  .btn-group { flex-direction: column; gap: 10px; }
  .btn-group .btn-primary,
  .btn-group .btn-secondary,
  .btn-primary,
  .btn-secondary { width: 100%; text-align: center; }

  /* ── Form inputs ── */
  .form-group input { font-size: 14px; padding: 10px 12px; }

  /* ── Hide non-essential elements ── */
  .maikr-links { display: none; }
}
</style>
  </head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

<header role="banner"><nav class="maikr-nav">
  <a href="/" class="maikr-logo">M<span>.ai</span><span>.K.R</span></a>
  <div class="maikr-links">
    <a href="/build">Builder</a>
    <a href="/command-center.html">Dashboard</a>
    <a href="/chat.html">Chat</a>
  </div>
  <div class="maikr-spacer"></div>
  <div class="maikr-status"><span class="dot"></span>Online</div>
</nav></header>

  <div class="page-wrapper">
    <header class="main-header">
      <a href="/" class="logo">
        <span class="logo-text">M.ai.K.R</span>
      </a>
      <div class="step-indicator">Step 3 of 4</div>
    </header>

    <main id="main-content" class="form-container">
      <div class="step-header">
        <h2>What will your agent do?</h2>
        <p>Select the primary ways your agent will interact with people.</p>
      </div>

      <form id="step3Form" novalidate>
        <div class="checkbox-group">
          <label class="checkbox-label"><input type="checkbox" name="useCase" value="support"> Customer Support — answer questions, resolve issues</label>
          <label class="checkbox-label"><input type="checkbox" name="useCase" value="sales"> Sales &amp; Lead Qualification — qualify prospects, book demos</label>
          <label class="checkbox-label"><input type="checkbox" name="useCase" value="onboarding"> User Onboarding — guide new users, tutorials</label>
          <label class="checkbox-label"><input type="checkbox" name="useCase" value="faq"> FAQ &amp; Knowledge Base — answer common questions</label>
          <label class="checkbox-label"><input type="checkbox" name="useCase" value="booking"> Appointment Booking — schedule meetings, reservations</label>
          <label class="checkbox-label"><input type="checkbox" name="useCase" value="feedback"> Feedback Collection — surveys, NPS, reviews</label>
        </div>
        <div class="form-group" style="margin-top:16px;">
          <label for="primaryUse">Primary use case</label>
          <input type="text" id="primaryUse" placeholder="Describe the main job your agent will handle">
        </div>
        <div class="form-group">
          <label for="forbidden">Topics to avoid (optional)</label>
          <input type="text" id="forbidden" placeholder="e.g., Pricing negotiations, competitor comparisons">
        </div>
        <div class="btn-group">
          <a href="/build/audience" class="btn-secondary">← Back</a>
          <button type="submit" class="btn-primary">Continue →</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const saved = JSON.parse(localStorage.getItem('maikr_form') || '{}');
    if (saved.useCases) {
      saved.useCases.forEach(v => {
        const cb = document.querySelector(`input[name="useCase"][value="${v}"]`);
        if (cb) cb.checked = true;
      });
    }
    if (saved.primaryUse) document.getElementById('primaryUse').value = saved.primaryUse;
    if (saved.forbidden) document.getElementById('forbidden').value = saved.forbidden;

    document.getElementById('step3Form').addEventListener('submit', function(e) {
      e.preventDefault();
      const useCases = [...document.querySelectorAll('input[name="useCase"]:checked')].map(c => c.value);
      const form = {
        useCases,
        primaryUse: document.getElementById('primaryUse').value.trim(),
        forbidden: document.getElementById('forbidden').value.trim()
      };
      localStorage.setItem('maikr_form', JSON.stringify({...saved, ...form}));
      window.location.href = '/build/plan';
    });
  </script>
</body>
</html>
