<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.ai.K.R - Maintenance</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e0e0e0;
            --accent-color: #00ff41; /* Matrix green */
            --accent-glow: rgba(0, 255, 65, 0.3);
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
            position: relative;
        }

        /* Branding element */
        .brand {
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .brand span {
            color: var(--text-color);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            opacity: 0.8;
        }

        .btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 0.8rem 2.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-family: var(--font-mono);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px var(--accent-glow);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--accent-color);
        }

        /* Matrix scanline effect */
        .container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
  <style>
    .skip-link {
      position: absolute; top: -100px; left: 0; z-index: 9999;
      padding: 12px 24px; background: #C0A060; color: #0A0A0F;
      font-weight: 700; font-size: 14px; text-decoration: none;
      border-radius: 0 0 8px 0; transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }
</style>
  </head>
<body>
    <div class="container">
        <div class="brand">M.ai.K.R<span>_</span></div>
        <h1>Taking a short break</h1>
        <p>M.ai.K.R is temporarily unavailable. Our team has been notified and is working on it. Try again in a few minutes.</p>
        <a href="https://maikr.pro/" class="btn">_RETRY_CONNECTION</a>
    </div>
</body>
</html>
