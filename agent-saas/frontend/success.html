<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — M.ai.K.R</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/maikr-v3.css">
  <style>
    .success-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--s6); }
    .success-card { max-width: 520px; width: 100%; padding: var(--s8); text-align: center; }
    .checkmark { width: 72px; height: 72px; margin: 0 auto var(--s5); border-radius: 50%; background: var(--green-dim); border: 3px solid var(--green); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--green); }
    .agent-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r2); padding: var(--s4); margin: var(--s6) 0; text-align: left; }
    .agent-box label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: var(--s2); }
    .agent-box input { width: 100%; padding: var(--s2) var(--s3); background: transparent; border: none; color: var(--plasma); font-family: var(--font-mono); font-size: 0.8rem; cursor: text; }
    .btn-row { display: flex; gap: var(--s3); justify-content: center; flex-wrap: wrap; margin-top: var(--s6); }
    .hidden-section { display: none; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-logo">M<span>.ai</span><span>.K.R</span></a>
    <div class="navbar-links">
      <a href="/login.html">Log In</a>
    </div>
  </nav>

  <div class="success-wrapper">
    <div class="success-card card animate-in">
      <div class="checkmark">✓</div>
      <h1 style="margin-bottom:var(--s1)">Payment Successful!</h1>
      <p style="color:var(--text-dim);margin-bottom:var(--s4)" id="paymentStatus">Setting up your agent…</p>

      <!-- Agent URL section -->
      <div class="agent-box" id="agentBox">
        <label>Your Agent URL</label>
        <input type="text" id="agentUrl" value="Provisioning your agent..." readonly onclick="this.select()">
      </div>

      <div class="btn-row">
        <a href="#" class="btn btn-amber" id="chatBtn">💬 Open Chat</a>
        <a href="#" class="btn btn-outline" id="setupBtn">⚙ Setup Wizard</a>
      </div>

      <!-- Logged-in section -->
      <div id="loggedInSection" class="hidden-section" style="margin-top:var(--s6)">
        <a href="/command-center.html" class="btn btn-amber btn-lg" style="width:100%">Go to Dashboard →</a>
      </div>

      <!-- Guest: Register form -->
      <div id="guestSection" class="hidden-section" style="margin-top:var(--s8)">
        <div class="card" style="padding:var(--s6);text-align:left">
          <h3 style="margin-bottom:var(--s1)">Create Your Account</h3>
          <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:var(--s6)">Set up your account to manage your agent.</p>
          <div id="regError" class="alert alert-error hidden" style="margin-bottom:var(--s4)"></div>
          <div id="regSuccess" class="alert alert-success hidden" style="margin-bottom:var(--s4)">Account created! Redirecting…</div>
          <form id="registerForm">
            <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Your name" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="you@company.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Min 8 characters" required minlength="8"></div>
            <button type="submit" class="btn btn-amber btn-lg" style="width:100%" id="regBtn">Create Account & Go to Dashboard</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id');

    // Poll for agent
    if (sessionId) {
      var retries = 0;
      function pollAgent() {
        fetch('/api/get-agent?session_id=' + sessionId)
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.agentUrl || data.agentId) {
              document.getElementById('paymentStatus').textContent = 'Your agent is ready!';
              if (data.agentUrl) {
                document.getElementById('agentUrl').value = data.agentUrl;
                document.getElementById('chatBtn').href = data.agentUrl;
              } else if (data.agentId) {
                document.getElementById('agentUrl').value = 'Agent #' + data.agentId;
                document.getElementById('chatBtn').href = '/chat.html?agent=' + data.agentId;
              }
              if (data.agentId) {
                document.getElementById('setupBtn').href = '/onboarding-wizard.html?agent=' + data.agentId;
              }
              document.getElementById('chatBtn').textContent = '💬 Start Chatting';
            }
            if (!data.agentUrl && !data.agentId && retries < 10) {
              retries++;
              setTimeout(pollAgent, 3000);
            } else if (retries >= 10) {
              document.getElementById('paymentStatus').textContent = '⚠️ Taking longer than expected. Check your email for updates.';
            }
          }).catch(function() {});
      }
      pollAgent();
    } else {
      document.getElementById('paymentStatus').textContent = '⚠️ No session found. If you completed payment, check your email.';
    }

    // Check auth state
    fetch('/api/auth/me', { credentials: 'include' }).then(function(res) {
      if (res.ok) {
        document.getElementById('loggedInSection').classList.remove('hidden-section');
      } else {
        document.getElementById('guestSection').classList.remove('hidden-section');
      }
    }).catch(function() {
      document.getElementById('guestSection').classList.remove('hidden-section');
    });

    // Registration form
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var name = document.getElementById('regName').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var pw = document.getElementById('regPassword').value;
      document.getElementById('regError').classList.add('hidden');
      if (!name || !email || pw.length < 8) {
        document.getElementById('regError').textContent = 'All fields required. Password min 8 characters.';
        document.getElementById('regError').classList.remove('hidden');
        return;
      }
      var btn = document.getElementById('regBtn'); btn.disabled = true; btn.textContent = 'Creating Account…';
      fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type':'application/json'}, credentials: 'include', body: JSON.stringify({name:name,email:email,password:pw}) })
        .then(function(r) { return r.json().then(function(d) { return {ok:r.ok,data:d}; }); })
        .then(function(r) {
          if (r.ok) {
            document.getElementById('regSuccess').classList.remove('hidden-section');
            document.getElementById('registerForm').style.display = 'none';
            setTimeout(function() { window.location.href = '/command-center.html'; }, 1500);
          } else {
            document.getElementById('regError').textContent = r.data.error || 'Registration failed.';
            document.getElementById('regError').classList.remove('hidden');
            btn.disabled = false; btn.textContent = 'Create Account & Go to Dashboard';
          }
        }).catch(function() {
          document.getElementById('regError').textContent = 'Connection error. Try again.';
          document.getElementById('regError').classList.remove('hidden');
          btn.disabled = false; btn.textContent = 'Create Account & Go to Dashboard';
        });
    });
  </script>
</body>
</html>
