<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.ai.K.R — 403 Forbidden</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/maikr-v3.css">
  <style>
    .status-code { font-size: 8rem; font-weight: 800; color: var(--amber); line-height: 1; margin-bottom: var(--s2); opacity: 0.8; }
  </style>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:var(--s6)">
  <div style="max-width:500px" class="animate-in">
    <div class="status-code" style="font-family:var(--font-mono)">403</div>
    <h1 style="margin-bottom:var(--s3)">Access Denied</h1>
    <p style="color:var(--text-dim);margin-bottom:var(--s8)">You don't have permission to access this resource. Try logging in or returning to the home page.</p>
    <div style="display:flex;gap:var(--s4);justify-content:center;flex-wrap:wrap">
      <a href="/" class="btn btn-amber">Go Home</a>
      <a href="/login.html" class="btn btn-ghost">Log In</a>
    </div>
  </div>
</body>
</html>
