<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audience & Tone — M.ai.K.R</title>
  <meta name="description" content="M.ai.K.R — AI agent teams that qualify leads, answer customers, and close tickets 24/7.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://maikr.pro/build-step2">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.maikr-nav {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  height: 52px;
}
.maikr-logo { font-size: 17px; font-weight: 700; color: #C0A060; text-decoration: none; letter-spacing: -0.5px; }
.maikr-logo span { color: #fff; }
.maikr-links { display: flex; gap: 4px; margin-left: 8px; }
.maikr-links a { color: #8b949e; text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 5px; transition: all 0.15s; }
.maikr-links a:hover { color: #e6edf3; background: #30363d; }
.maikr-links a.active { color: #C0A060; }
.maikr-spacer { flex: 1; }
.maikr-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8b949e; }
.maikr-status .dot { width: 7px; height: 7px; background: #C0A060; border-radius: 50%; box-shadow: 0 0 5px #C0A060; }
}</style>

  <style>
    .skip-link {
      position: absolute; top: -100px; left: 0; z-index: 9999;
      padding: 12px 24px; background: #C0A060; color: #0A0A0F;
      font-weight: 700; font-size: 14px; text-decoration: none;
      border-radius: 0 0 8px 0; transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }
</style>
<style>
/* ============================================================
   Mobile Breakpoints (≤768px)
   ============================================================ */
@media (max-width: 768px) {
  /* Prevent horizontal overflow */
  html, body {
    overflow-x: hidden !important;
  }

  /* Nav: compress spacing */
  .maikr-nav {
    padding: 0 12px !important;
    gap: 12px !important;
    height: 48px !important;
  }
  .maikr-logo {
    font-size: 14px !important;
  }
  .maikr-links {
    display: none !important;  /* hide top links on mobile */
  }
  .maikr-status {
    font-size: 10px !important;
  }
  .maikr-status .dot {
    width: 5px !important;
    height: 5px !important;
  }

  /* Page wrapper: full-width with padding */
  .page-wrapper {
    width: 100% !important;
    padding: 0 16px !important;
    margin: 0 !important;
  }

  /* Main header stack */
  .main-header {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 8px !important;
    padding: 16px 0 !important;
  }
  .main-header .logo-text {
    font-size: 16px !important;
  }
  .step-indicator {
    font-size: 12px !important;
  }

  /* Form container: full-width */
  .form-container {
    max-width: 100% !important;
    padding: 20px 16px !important;
    margin: 0 !important;
  }

  /* Step header: smaller heading */
  .step-header h2 {
    font-size: 1.35rem !important;
  }
  .step-header p {
    font-size: 0.85rem !important;
  }

  /* Form groups: increase tap targets */
  .form-group {
    margin-bottom: 16px !important;
  }
  .form-group label {
    font-size: 0.82rem !important;
  }
  .form-group input,
  .form-group select {
    font-size: 16px !important;  /* prevent iOS zoom */
    padding: 12px 14px !important;
  }

  /* Button group: stack vertically, full-width buttons */
  .btn-group {
    flex-direction: column !important;
    gap: 10px !important;
  }
  .btn-group .btn-primary,
  .btn-group .btn-secondary {
    width: 100% !important;
    text-align: center !important;
    justify-content: center !important;
    padding: 12px 20px !important;
    font-size: 0.95rem !important;
  }

  /* Hide non-essential elements */
  .maikr-spacer {
    display: none !important;
  }
}
</style>
  </head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

<header role="banner"><nav class="maikr-nav">
  <a href="/" class="maikr-logo">M<span>.ai</span><span>.K.R</span></a>
  <div class="maikr-links">
    <a href="/build">Builder</a>
    <a href="/command-center.html">Dashboard</a>
    <a href="/chat.html">Chat</a>
  </div>
  <div class="maikr-spacer"></div>
  <div class="maikr-status"><span class="dot"></span>Online</div>
</nav></header>

  <div class="page-wrapper">
    <header class="main-header">
      <a href="/" class="logo">
        <span class="logo-text">M.ai.K.R</span>
      </a>
      <div class="step-indicator">Step 2 of 4</div>
    </header>

    <main id="main-content" class="form-container">
      <div class="step-header">
        <h2>Who is your audience?</h2>
        <p>We'll tailor your agent's voice and responses to your ideal customer.</p>
      </div>

      <form id="step2Form" novalidate>
        <div class="form-group">
          <label for="audience">Primary audience</label>
          <input type="text" id="audience" placeholder="e.g., Small business owners, ages 30-55">
        </div>
        <div class="form-group">
          <label for="tone">Communication style</label>
          <select id="tone">
            <option value="formal">Formal — professional, precise</option>
            <option value="informative" selected>Informative — clear, educational</option>
            <option value="supportive">Supportive — warm, encouraging</option>
            <option value="persuasive">Persuasive — compelling, action-oriented</option>
            <option value="humorous">Humorous — playful, entertaining</option>
          </select>
        </div>
        <div class="form-group">
          <label for="responseLength">Typical response length</label>
          <select id="responseLength">
            <option value="concise">Concise — quick answers, fewer details</option>
            <option value="balanced" selected>Balanced — moderate detail, clear</option>
            <option value="comprehensive">Comprehensive — thorough, detailed</option>
          </select>
        </div>
        <div class="btn-group">
          <a href="/build" class="btn-secondary">← Back</a>
          <button type="submit" class="btn-primary">Continue →</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const saved = JSON.parse(localStorage.getItem('maikr_form') || '{}');
    if (saved.audience) document.getElementById('audience').value = saved.audience;
    if (saved.tone) document.getElementById('tone').value = saved.tone;
    if (saved.responseLength) document.getElementById('responseLength').value = saved.responseLength;

    document.getElementById('step2Form').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = {
        audience: document.getElementById('audience').value.trim(),
        tone: document.getElementById('tone').value,
        responseLength: document.getElementById('responseLength').value
      };
      localStorage.setItem('maikr_form', JSON.stringify({...saved, ...form}));
      window.location.href = '/build/usecases';
    });
  </script>
</body>
</html>
