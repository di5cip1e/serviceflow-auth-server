<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — M.ai.K.R</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/maikr-v3.css">
  <style>
    .auth-card { max-width: 420px; width: 100%; padding: var(--s8); }
    .auth-card h1 { font-size: 1.5rem; margin-bottom: var(--s1); }
    .auth-card .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: var(--s8); }
    .auth-footer { text-align: center; margin-top: var(--s6); font-size: 0.85rem; color: var(--text-dim); }
    .auth-footer a { color: var(--amber); font-weight: 600; }

    /* ── Mobile breakpoints (≤ 768px) ── */
    @media (max-width: 768px) {
      body {
        overflow-x: hidden;
      }

      .auth-page {
        padding: var(--s4) var(--s3);
        flex-direction: column;
      }

      .auth-card {
        max-width: 100%;
        width: 100%;
        padding: var(--s6);
      }

      .auth-card h1 {
        font-size: 1.25rem;
      }

      .auth-card .subtitle {
        font-size: 0.8rem;
        margin-bottom: var(--s6);
      }

      /* Make buttons full-width (if not already) */
      .auth-card .btn,
      #loginBtn {
        width: 100% !important;
        display: block;
      }

      /* Nav: stack links under the logo */
      .navbar {
        flex-wrap: wrap;
        padding: var(--s3) var(--s4);
      }

      .navbar-links {
        width: 100%;
        justify-content: flex-start;
        gap: var(--s4);
        margin-top: var(--s2);
      }

      /* Hide the "Forgot password?" link on very small screens to reduce clutter */
      .auth-footer a[href="/forgot-password.html"] {
        display: none;
      }

      /* Auth footer spacing */
      .auth-footer {
        margin-top: var(--s4);
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-logo">M<span>.ai</span><span>.K.R</span></a>
    <div class="navbar-links">
      <a href="/pricing.html">Pricing</a>
      <a href="/register.html">Sign Up</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card card animate-in">
      <h1>Welcome Back</h1>
      <p class="subtitle">Log in to manage your AI agents.</p>

      <div id="loginError" class="alert alert-error hidden" style="margin-bottom:var(--s6)"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
          <div id="emailError" class="form-error"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
          <div id="passwordError" class="form-error"></div>
        </div>
        <button type="submit" class="btn btn-amber btn-lg" style="width:100%" id="loginBtn">Log In</button>
      </form>

      <div class="auth-footer" style="display:flex;justify-content:space-between;margin-top:var(--s4)">
        <a href="/forgot-password.html">Forgot password?</a>
      </div>
      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create one →</a>
      </div>
    </div>
  </div>

  <script>
    // Parse redirect param
    var params = new URLSearchParams(window.location.search);
    var redirectTo = params.get('redirect') || '/command-center.html';

    // Check for saved build data
    var buildData = localStorage.getItem('maikrBuildData');

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var err = document.getElementById('loginError');
      err.classList.add('hidden');
      document.getElementById('emailError').classList.remove('show');
      document.getElementById('passwordError').classList.remove('show');

      var valid = true;
      if (!email) { document.getElementById('emailError').classList.add('show'); document.getElementById('emailError').textContent = 'Email is required.'; valid = false; }
      if (!password) { document.getElementById('passwordError').classList.add('show'); document.getElementById('passwordError').textContent = 'Password is required.'; valid = false; }
      if (!valid) return;

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: email, password: password })
        });
        var data = await res.json();
        if (res.ok) {
          // If build data exists, redirect to build
          if (buildData) {
            window.location.href = '/build';
          } else {
            window.location.href = redirectTo;
          }
        } else {
          err.textContent = data.error || 'Invalid email or password.';
          err.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Log In';
        }
      } catch(e) {
        err.textContent = 'Connection error. Please try again.';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
