<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — M.ai.K.R</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2ECC71;
      --danger: #f85149;
      --warn: #d29922;
      --blue: #58a6ff;
      --green: #2ECC71;
      --text-dim: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top Nav ── */
    .topnav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 56px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topnav .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .topnav .logo span { color: #fff; }
    .nav-links { display: flex; gap: 4px; margin-left: 16px; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .nav-links a:hover { color: var(--text); background: var(--border); }
    .nav-links a.active { color: var(--accent); }
    .nav-spacer { flex: 1; }
    .nav-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--green);
    }

    /* ── Masthead ── */
    .masthead {
      position: relative;
      height: 140px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .masthead-bg {
      position: absolute;
      inset: 0;
      background: url('assets/maikr-banner.jpg') center/cover no-repeat;
    }
    .masthead-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(13,17,23,0.7) 0%, rgba(13,17,23,0.95) 100%);
    }
    .masthead-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding: 0 32px 20px;
    }
    .masthead-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text { font-size: 22px; font-weight: 700; color: var(--green); }
    .logo-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .agent-info-header { margin-left: 24px; }
    .agent-info-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .agent-info-header p { font-size: 13px; color: var(--muted); }

    /* ── Chat Area ── */
    main {
      flex: 1;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      min-height: 300px;
      max-height: calc(100vh - 340px);
    }
    .message {
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      max-width: 80%;
      animation: fadeIn 0.25s ease;
      line-height: 1.55;
      font-size: 15px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.ai {
      background: var(--bg);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-left: 3px solid var(--accent);
    }
    .message.user {
      background: var(--accent);
      color: #0a0a0a;
      margin-left: auto;
      font-weight: 500;
    }
    .message.system {
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      border: 1px dashed var(--border);
      max-width: 100%;
      padding: 8px 16px;
    }
    .message time {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
    .message.user time { color: rgba(0,0,0,0.5); }

    /* Typing indicator */
    .typing {
      display: none;
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .typing.show { display: flex; gap: 4px; align-items: center; }
    .typing span {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; } }

    /* Chat input */
    .chat-input {
      display: flex;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 12px;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }
    .chat-input input::placeholder { color: var(--muted); }
    .chat-input button {
      padding: 10px 20px;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .chat-input button:hover { box-shadow: 0 0 14px rgba(46,204,113,0.4); }
    .chat-input button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; box-shadow: none; }

    /* No agent state */
    .no-agent {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .no-agent h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .no-agent p { font-size: 14px; margin-bottom: 20px; }
    .no-agent a { color: var(--accent); text-decoration: none; }
    .no-agent a:hover { text-decoration: underline; }

    /* API key input (for non-logged-in users) */
    .api-key-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .api-key-section h3 { font-size: 14px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
    .api-key-form { display: flex; gap: 8px; }
    .api-key-form input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .api-key-form input:focus { border-color: var(--accent); }
    .api-key-form button {
      padding: 10px 18px;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
    }
    .api-key-form button:hover { background: var(--accent); color: #0a0a0a; }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="topnav">
    <a href="/" class="logo">M<span>.ai</span><span>.K.R</span></a>
    <div class="nav-links">
      <a href="/command-center.html">Dashboard</a>
      <a href="/swarm.html">Swarm</a>
      <a href="/mcp.html">MCP</a>
      <a href="/channels.html">Channels</a>
      <a href="/optimization.html">Optimize</a>
      <a href="/observe.html">Observe</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-status">
      <div class="status-dot"></div>
      <span id="navStatus">Connecting…</span>
    </div>
  </nav>

  <!-- Masthead -->
  <div class="masthead">
    <div class="masthead-bg"></div>
    <div class="masthead-overlay"></div>
    <div class="masthead-content">
      <div class="masthead-logo">
        <div class="logo-icon">🤖</div>
        <div class="logo-text">M.ai.K.R</div>
      </div>
      <div class="agent-info-header">
        <h2 id="agentNameDisplay">Your AI Agent</h2>
        <p id="businessNameDisplay">Brand-trained AI assistant</p>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <main>
    <div id="noAgentUI" class="no-agent" style="display:none;">
      <h3>No Agent Connected</h3>
      <p>Enter your API key below, or use your agent's unique URL to start chatting.</p>
      <div class="api-key-section">
        <h3>API Key</h3>
        <div class="api-key-form">
          <input type="text" id="apiKeyInput" placeholder="makr_...">
          <button id="loadAgentBtn">Load Agent</button>
        </div>
      </div>
      <p style="font-size:13px;">Don't have an agent? <a href="/build">Create one →</a></p>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message ai system">Loading your agent…</div>
    </div>

    <div class="typing" id="typingIndicator">
      <span></span><span></span><span></span>
    </div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Ask your agent anything…" autocomplete="off" disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </main>

  <script>
    const API_BASE = '';
    const urlParams = new URLSearchParams(window.location.search);
    let agentId = urlParams.get('agent');
    let apiKey = urlParams.get('key') || localStorage.getItem('maikr_apikey') || '';
    let agentName = '';
    let businessName = '';
    let chatHistory = [];

    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const noAgentUI = document.getElementById('noAgentUI');
    const navStatus = document.getElementById('navStatus');
    const loadAgentBtn = document.getElementById('loadAgentBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // ── Init ──
    function init() {
      if (agentId) {
        localStorage.setItem('maikr_agentid', agentId);
        loadAgentInfo();
      } else {
        agentId = localStorage.getItem('maikr_agentid');
        apiKey = localStorage.getItem('maikr_apikey') || '';
        if (agentId) {
          loadAgentInfo();
        } else {
          showNoAgent();
        }
      }
      if (apiKey) apiKeyInput.value = apiKey;
    }

    function showNoAgent() {
      chatMessages.innerHTML = '<div class="message ai system">No agent found. Enter your API key to continue.</div>';
      noAgentUI.style.display = 'block';
      messageInput.disabled = true;
      sendBtn.disabled = true;
      navStatus.textContent = 'No agent';
    }

    function enableChat() {
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
      navStatus.textContent = 'Online';
      addMessage('👋 Hi! I\'m your brand-trained AI assistant. How can I help you today?', 'ai');
    }

    // ── Load agent info ──
    function loadAgentInfo() {
      if (!agentId) return;
      fetch(API_BASE + '/api/agent-info?agentId=' + agentId)
        .then(r => r.json())
        .then(data => {
          if (data.agentName) {
            agentName = data.agentName;
            businessName = data.businessName || 'Brand-trained AI assistant';
            document.getElementById('agentNameDisplay').textContent = agentName;
            document.getElementById('businessNameDisplay').textContent = businessName;
            document.title = agentName + ' — M.ai.K.R';
            addMessage('👋 Hi! I\'m your brand-trained AI assistant. How can I help you today?', 'ai');
          }
          enableChat();
        })
        .catch(() => {
          enableChat(); // still allow chat without info
        });
    }

    // ── Messages ──
    function addMessage(text, type = 'ai', timestamp = new Date()) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      const time = timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `<span>${escapeHtml(text)}</span><time>${time}</time>`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      chatHistory.push({ role: type === 'user' ? 'user' : 'assistant', content: text });
    }

    function escapeHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    // ── Send ──
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !agentId) return;

      addMessage(text, 'user');
      messageInput.value = '';
      sendBtn.disabled = true;
      typingIndicator.classList.add('show');

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (apiKey) headers['X-API-Key'] = apiKey;
        const response = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers,
          body: JSON.stringify({ agentId, message: text })
        });
        const data = await response.json();
        typingIndicator.classList.remove('show');
        if (data.response) {
          addMessage(data.response);
        } else if (data.error) {
          addMessage('Error: ' + data.error);
        }
      } catch (err) {
        typingIndicator.classList.remove('show');
        addMessage('Connection error. Please check your connection and try again.');
      }
      sendBtn.disabled = false;
      messageInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

    // ── Load via API key ──
    loadAgentBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) return;
      apiKey = key;
      localStorage.setItem('maikr_apikey', apiKey);
      // Extract agentId from key or prompt — for now just save and reload
      noAgentUI.style.display = 'none';
      messageInput.disabled = false;
      sendBtn.disabled = false;
      navStatus.textContent = 'Online';
      chatMessages.innerHTML = '<div class="message ai">API key saved. How can I help you today?</div>';
      messageInput.focus();
    });

    // ── Auto-scroll messages ──
    const obs = new MutationObserver(() => {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });
    obs.observe(chatMessages, { childList: true, subtree: true });

    init();
  </script>
</body>
</html>
