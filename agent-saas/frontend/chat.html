<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — M.ai.K.R</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/maikr-v3.css">
  <style>
    .chat-split { display: flex; height: calc(100vh - var(--navbar-h)); margin-top: var(--navbar-h); }
    .chat-list { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .chat-list-header { padding: var(--s4); border-bottom: 1px solid var(--border); }
    .chat-list-header h2 { font-size: 1rem; margin: 0; }
    .chat-agent-item { padding: var(--s4); border-bottom: 1px solid var(--border); cursor: pointer; transition: background var(--t-fast); display: flex; align-items: center; gap: var(--s3); }
    .chat-agent-item:hover { background: rgba(255,255,255,0.03); }
    .chat-agent-item.selected { background: var(--amber-dim); border-left: 3px solid var(--amber); }
    .chat-agent-avatar { width: 36px; height: 36px; border-radius: var(--r-full); background: var(--amber-dim); color: var(--amber); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }
    .chat-agent-name { font-weight: 600; font-size: 0.88rem; color: var(--text); }
    .chat-agent-plan { font-size: 0.72rem; color: var(--text-muted); }
    .chat-main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
    .chat-topbar { padding: var(--s3) var(--s5); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--s3); background: var(--surface); flex-shrink: 0; }
    .chat-topbar h3 { font-size: 0.95rem; margin: 0; }
    .chat-msgs { flex: 1; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
    .chat-msg { max-width: 75%; padding: 10px 16px; border-radius: var(--r3); font-size: 0.88rem; line-height: 1.5; animation: msgIn 0.3s var(--t-slow); }
    .chat-msg.agent { background: var(--surface2); color: var(--text-dim); align-self: flex-start; border-bottom-left-radius: var(--r1); }
    .chat-msg.user { background: linear-gradient(135deg,#0040A0,#0060D0); color: #fff; align-self: flex-end; border-bottom-right-radius: var(--r1); }
    .chat-msg.system { background: var(--amber-dim); color: var(--amber); align-self: center; font-size: 0.78rem; padding: 5px 12px; border-radius: var(--r-full); }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .chat-input-row { padding: var(--s4); border-top: 1px solid var(--border); display: flex; gap: var(--s3); background: var(--surface); flex-shrink: 0; }
    .chat-input-row textarea { flex: 1; min-height: 44px; max-height: 100px; resize: none; border-radius: var(--r3); font-size: 0.9rem; }
    .quick-row { display: flex; flex-wrap: wrap; gap: var(--s2); padding: var(--s2) var(--s5); }
    .quick-chip { padding: 5px 12px; border-radius: var(--r-full); font-size: 0.75rem; background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(192,160,96,0.15); cursor: pointer; transition: all var(--t-fast); }
    .quick-chip:hover { background: var(--amber); color: var(--bg); }
    .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); gap: var(--s4); padding: var(--s8); }
    .empty-chat .empty-icon { font-size: 4rem; opacity: 0.3; margin-bottom: var(--s3); }
    @media (max-width: 768px) { .chat-list { display: none; } .chat-msg { max-width: 88%; } }
  </style>
</head>
<body>
<div class="chat-split">
  <div class="chat-list">
    <div class="chat-list-header"><h2>💬 Your Agents</h2></div>
    <div id="agentList"><div style="padding:var(--s4);color:var(--text-muted);font-size:0.85rem;text-align:center">Loading agents…</div></div>
  </div>

  <div class="chat-main-area">
    <div class="chat-topbar">
      <h3 id="chatTitle">Select an Agent</h3>
      <span class="badge badge-neutral hidden" id="chatStatusBadge">Ready</span>
    </div>

    <div class="quick-row" id="quickReplies" style="display:none">
      <span class="quick-chip" onclick="sendQuick('Hello! Can you help me?')">👋 Hello</span>
      <span class="quick-chip" onclick="sendQuick('What can you do for my business?')">💼 Capabilities</span>
      <span class="quick-chip" onclick="sendQuick('I need help with a customer')">🙋 Customer Help</span>
      <span class="quick-chip" onclick="sendQuick('Tell me about my plan')">📊 My Plan</span>
    </div>

    <div id="chatArea">
      <div class="empty-chat">
        <div class="empty-icon">💬</div>
        <h3 style="color:var(--text)">Select an Agent</h3>
        <p style="font-size:0.9rem">Choose an agent from the sidebar to start chatting.</p>
      </div>
    </div>

    <div class="chat-input-row" id="chatInputRow" style="display:none">
      <textarea id="chatInput" placeholder="Type a message…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button class="btn btn-amber" onclick="sendMessage()" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  var currentAgent = null;

  // Auth
  fetch('/api/auth/me',{credentials:'include'}).then(function(r){if(r.status===401){window.location.href='/login.html';return Promise.reject();}return r.json();}).then(function(d){
    return fetch('/api/my-agents',{credentials:'include'});
  }).then(function(r){return r.json();}).then(function(data){
    var agents = Array.isArray(data) ? data : (data.agents || []);
    var list = document.getElementById('agentList');
    if (!agents.length) { list.innerHTML = '<div style="padding:var(--s4);text-align:center;color:var(--text-dim);font-size:0.85rem">No agents yet.<br><a href="/build" style="color:var(--amber)">Create one →</a></div>'; return; }
    list.innerHTML = agents.map(function(a, i) {
      return '<div class="chat-agent-item" onclick="selectAgent(\'' + a.id + '\', \'' + (a.agent_name || a.name || 'Agent').replace(/'/g,"\\'") + '\')" data-id="' + a.id + '">' +
        '<div class="chat-agent-avatar">' + (a.agent_name || 'A').charAt(0).toUpperCase() + '</div>' +
        '<div><div class="chat-agent-name">' + (a.agent_name || a.name || 'Agent') + '</div><div class="chat-agent-plan">' + (a.plan_name || a.tier || 'Standard') + '</div></div></div>';
    }).join('');
    // Select first if no current
    if (agents.length && !currentAgent) selectAgent(agents[0].id, agents[0].agent_name || agents[0].name || 'Agent');
  }).catch(function(){});

  window.selectAgent = function(id, name) {
    currentAgent = id;
    document.getElementById('chatTitle').textContent = name;
    document.getElementById('chatStatusBadge').classList.remove('hidden');
    document.getElementById('chatStatusBadge').textContent = 'Connected';
    document.getElementById('chatStatusBadge').className = 'badge badge-success';
    document.getElementById('chatInputRow').style.display = 'flex';
    document.getElementById('quickReplies').style.display = 'flex';
    document.querySelectorAll('.chat-agent-item').forEach(function(el){el.classList.toggle('selected',el.dataset.id===id);});
    document.getElementById('chatArea').innerHTML = '<div class="chat-msgs" id="chatMsgs"><div class="chat-msg system">Agent ' + name + ' is ready. How can I help?</div></div>';
    document.getElementById('chatInput').focus();
  };

  window.sendQuick = function(msg) {
    document.getElementById('chatInput').value = msg;
    sendMessage();
  };

  window.sendMessage = function() {
    var input = document.getElementById('chatInput');
    var msg = input.value.trim();
    if (!msg || !currentAgent) return;
    input.value = '';
    input.style.height = 'auto';

    var msgs = document.getElementById('chatMsgs');
    if (!msgs) { document.getElementById('chatArea').innerHTML = '<div class="chat-msgs" id="chatMsgs"></div>'; msgs = document.getElementById('chatMsgs'); }
    
    msgs.insertAdjacentHTML('beforeend', '<div class="chat-msg user">' + escapeHtml(msg) + '</div>');
    msgs.insertAdjacentHTML('beforeend', '<div class="chat-msg agent" id="typingMsg"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div></div>');
    msgs.scrollTop = msgs.scrollHeight;

    var sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;

    fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      credentials: 'include',
      body: JSON.stringify({agentId: currentAgent, message: msg})
    }).then(function(r){return r.json();}).then(function(d){
      var typing = document.getElementById('typingMsg');
      if (typing) typing.outerHTML = '<div class="chat-msg agent">' + escapeHtml(d.reply || d.message || d.response || '(no response)') + '</div>';
      msgs.scrollTop = msgs.scrollHeight;
    }).catch(function(){
      var typing = document.getElementById('typingMsg');
      if (typing) typing.outerHTML = '<div class="chat-msg system">⚠️ Failed to send. Please try again.</div>';
    }).finally(function(){sendBtn.disabled = false;});
  };

  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
