<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Your AI Agent - M.ai.K.R</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/maikr.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; }
    
    /* Matrix Background */
    #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.1; }
    
    .chat-container { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; width: 100%; padding: 20px; }
    
    /* Header */
    .chat-header { text-align: center; padding: 15px; border-bottom: 1px solid var(--primary, #00ff41); margin-bottom: 20px; }
    .chat-header h1 { color: var(--primary, #00ff41); font-size: 24px; text-shadow: 0 0 15px var(--primary, #00ff41)40; }
    .chat-header p { color: #888; font-size: 14px; margin-top: 5px; }
    
    /* Messages */
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; background: rgba(17,17,17,0.9); border: 1px solid #333; border-radius: 12px; margin-bottom: 20px; }
    .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; max-width: 80%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.ai { background: #111; border: 1px solid var(--primary, #00ff41); align-self: flex-start; }
    .message.user { background: var(--orange, #f97316); color: #0a0a0a; margin-left: auto; }
    .message.system { background: #1a1a1a; color: #888; font-size: 12px; text-align: center; border: 1px dashed #333; max-width: 100%; }
    
    /* Typing Indicator */
    .typing { display: none; padding: 12px 16px; background: #111; border: 1px solid #333; border-radius: 12px; margin-bottom: 15px; }
    .typing.show { display: block; }
    .typing span { color: var(--primary, #00ff41); }
    
    /* Input */
    .chat-input { display: flex; gap: 10px; }
    .chat-input input { flex: 1; padding: 14px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: inherit; }
    .chat-input input:focus { outline: none; border-color: var(--primary, #00ff41); box-shadow: 0 0 15px var(--primary, #00ff41)40; }
    .chat-input button { padding: 14px 30px; background: var(--primary, #00ff41); color: #0a0a0a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .chat-input button:hover { box-shadow: 0 0 20px var(--primary, #00ff41)40; }
    .chat-input button:disabled { background: #333; color: #666; cursor: not-allowed; }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  
  <div class="chat-container">
    <div class="chat-header">
      <h1>🤖 <span id="agentName">Your AI Agent</span> <a href="brand-assets.html" style="font-size:13px;font-weight:400;color:#2ECC71;text-decoration:none;margin-left:8px;">📚 Brand Assets</a></h1>
      <p id="businessName">Custom AI Assistant</p>
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message ai">👋 Hi! I'm your brand-trained AI assistant. How can I help you today?</div>
    </div>
    
    <div class="typing" id="typingIndicator">
      <span>●</span><span>●</span><span>●</span> Thinking...
    </div>
    
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const API_BASE = '';
    const urlParams = new URLSearchParams(window.location.search);
    const agentId = urlParams.get('agent');
    
    if (!agentId) {
      document.getElementById('chatMessages').innerHTML = '<div class="message system">No agent specified. Please use your unique agent URL.</div>';
    }
    
    // Matrix Background
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const fontSize = 14, columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()[]{}|;:,.<>?';
    function draw() {
      ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillStyle = Math.random() > 0.9 ? '#fff' : '#00ff41';
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 50);
    
    // Chat Functionality
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatMessages = document.getElementById('chatMessages');
    const typingIndicator = document.getElementById('typingIndicator');
    
    function addMessage(text, isUser = false) {
      const div = document.createElement('div');
      div.className = 'message ' + (isUser ? 'user' : 'ai');
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !agentId) return;
      
      addMessage(text, true);
      messageInput.value = '';
      sendBtn.disabled = true;
      typingIndicator.classList.add('show');
      
      try {
        const response = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentId, message: text })
        });
        
        const data = await response.json();
        typingIndicator.classList.remove('show');
        
        if (data.response) {
          addMessage(data.response);
        } else if (data.error) {
          addMessage('Error: ' + data.error);
        }
      } catch (err) {
        typingIndicator.classList.remove('show');
        addMessage('Connection error. Please try again.');
      }
      
      sendBtn.disabled = false;
      messageInput.focus();
    }
    
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    // Load agent info
    if (agentId) {
      fetch(API_BASE + '/api/agent-info?agentId=' + agentId)
        .then(r => r.json())
        .then(data => {
          if (data.agentName) document.getElementById('agentName').textContent = data.agentName;
          if (data.businessName) document.getElementById('businessName').textContent = data.businessName;
        });
    }
  </script>
</body>
</html>
