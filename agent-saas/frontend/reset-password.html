<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — M.ai.K.R</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/maikr-v3.css">
  <style>
    .back-link { display: block; text-align: center; margin-top: var(--s6); color: var(--text-dim); font-size: 0.85rem; }
    .back-link a { color: var(--amber); }

    @media (max-width: 768px) {
      body.auth-page { padding: var(--s4); overflow-x: hidden; }
      body.auth-page .auth-card { max-width: 100% !important; padding: var(--s5) !important; }
      body.auth-page h1 { font-size: 1.5rem; }
      body.auth-page .subtitle { font-size: 0.8rem; }
      body.auth-page .auth-form .form-group { margin-bottom: var(--s4); }
      body.auth-page .auth-form .form-group label { font-size: 0.85rem; }
      body.auth-page .auth-form .form-group input { font-size: 1rem; padding: var(--s3) var(--s4); }
      body.auth-page .auth-form .btn { width: 100% !important; font-size: 1rem; padding: var(--s4); }
      body.auth-page .back-link { font-size: 0.8rem; margin-top: var(--s4); }
      body.auth-page .alert { font-size: 0.85rem; }
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card card animate-in" style="max-width:420px;width:100%;padding:var(--s8)">
    <h1 class="text-center" style="margin-bottom:var(--s1)">Set New Password</h1>
    <p class="subtitle" style="text-align:center;color:var(--text-dim);font-size:0.9rem;margin-bottom:var(--s8)">Choose a strong password for your account.</p>
    
    <div id="successMsg" class="alert alert-success hidden" style="margin-bottom:var(--s6)">Password reset successfully! <a href="/login.html">Log in</a> with your new password.</div>
    <div id="errorMsg" class="alert alert-error hidden" style="margin-bottom:var(--s6)"></div>

    <form id="resetForm" class="auth-form">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
        <div id="passwordError" class="form-error"></div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password">
        <div id="confirmPasswordError" class="form-error"></div>
      </div>
      <button type="submit" class="btn btn-amber btn-lg" style="width:100%" id="submitBtn">Reset Password</button>
    </form>
    <p class="back-link"><a href="/login.html">← Back to Login</a></p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (!token) {
      document.getElementById('errorMsg').textContent = 'Invalid or missing reset token. Please request a new reset link.';
      document.getElementById('errorMsg').classList.remove('hidden');
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var pw = document.getElementById('password').value;
      var cp = document.getElementById('confirmPassword').value;
      var pwErr = document.getElementById('passwordError');
      var cpErr = document.getElementById('confirmPasswordError');
      pwErr.classList.remove('show');
      cpErr.classList.remove('show');
      var valid = true;
      if (pw.length < 8) { pwErr.textContent = 'Must be at least 8 characters.'; pwErr.classList.add('show'); valid = false; }
      if (pw !== cp) { cpErr.textContent = 'Passwords do not match.'; cpErr.classList.add('show'); valid = false; }
      if (!valid) return;
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Resetting…';
      try {
        var res = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({token: token, password: pw})
        });
        var data = await res.json();
        if (res.ok) {
          document.getElementById('resetForm').style.display = 'none';
          document.getElementById('successMsg').classList.remove('hidden');
        } else {
          document.getElementById('errorMsg').textContent = data.error || 'Failed to reset password.';
          document.getElementById('errorMsg').classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch(e) {
        document.getElementById('errorMsg').textContent = 'Something went wrong. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
