<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — M.ai.K.R</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/maikr-v3.css">
  <style>
    .auth-actions { display: flex; gap: var(--s3); margin-top: var(--s6); }
    .back-link { display: block; text-align: center; margin-top: var(--s6); color: var(--text-dim); font-size: 0.85rem; }
    .back-link a { color: var(--amber); }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card card animate-in" style="max-width:420px;width:100%;padding:var(--s8)">
    <h1 class="text-center" style="margin-bottom:var(--s1)">Forgot Password</h1>
    <p class="subtitle" style="text-align:center;color:var(--text-dim);font-size:0.9rem;margin-bottom:var(--s8)">Enter your email and we'll send you a reset link.</p>
    
    <div id="successMsg" class="alert alert-success hidden" style="margin-bottom:var(--s6)">If an account exists with that email, we've sent password reset instructions.</div>
    <div id="errorMsg" class="alert alert-error hidden" style="margin-bottom:var(--s6)"></div>

    <form id="forgotForm" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
        <div id="emailError" class="form-error"></div>
      </div>
      <button type="submit" class="btn btn-amber btn-lg" style="width:100%" id="submitBtn">Send Reset Link</button>
    </form>
    <p class="back-link"><a href="/login.html">← Back to Login</a></p>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var err = document.getElementById('emailError');
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        err.textContent = 'Please enter a valid email address.';
        err.classList.add('show');
        return;
      }
      err.classList.remove('show');
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        var res = await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email: email})
        });
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('successMsg').classList.remove('hidden');
        document.getElementById('errorMsg').classList.add('hidden');
      } catch(e) {
        document.getElementById('errorMsg').textContent = 'Something went wrong. Please try again.';
        document.getElementById('errorMsg').classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
