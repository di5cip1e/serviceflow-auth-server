<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — M.ai.K.R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dark-premium.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--void);
      padding: var(--space-lg);
      position: relative;
    }
    .auth-page::before {
      content: '';
      position: absolute;
      top: -20%; right: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(0,64,160,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: linear-gradient(180deg, var(--gunmetal) 0%, rgba(10,10,15,0.9) 100%);
      border: 1px solid var(--steel);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      box-shadow: var(--shadow-card);
      position: relative; z-index: 1;
    }
    .auth-card h1 { font-size: 1.375rem; font-weight: 700; color: var(--white); margin-bottom: var(--space-xs); }
    .auth-card .subtitle { color: var(--smoke); font-size: 0.9375rem; margin-bottom: var(--space-xl); line-height: 1.5; }
    .field { margin-bottom: var(--space-lg); }
    .field label { display: block; font-weight: 600; margin-bottom: var(--space-sm); font-size: 0.875rem; color: var(--silver); }
    .field input {
      width: 100%; padding: 12px 16px;
      background: var(--void); border: 1px solid var(--steel); border-radius: var(--radius-md);
      color: var(--white); font-family: var(--font-main); font-size: 0.9375rem;
      transition: all var(--transition-normal); outline: none;
    }
    .field input::placeholder { color: var(--muted); }
    .field input:focus { border-color: var(--electric); box-shadow: 0 0 0 3px rgba(0,64,160,0.2); }
    .btn {
      width: 100%; padding: 12px 24px;
      background: linear-gradient(135deg, var(--electric), var(--electric-light));
      color: var(--white); border: none; border-radius: var(--radius-md);
      font-weight: 600; font-size: 0.9375rem; font-family: var(--font-main);
      cursor: pointer; transition: all var(--transition-normal);
      box-shadow: 0 2px 12px rgba(0,64,160,0.3);
    }
    .btn:hover { box-shadow: var(--shadow-glow-blue); transform: translateY(-1px); }
    .msg {
      padding: var(--space-md); border-radius: var(--radius-md);
      font-size: 0.875rem; margin-bottom: var(--space-lg); display: none;
    }
    .msg.ok { background: rgba(46,204,113,0.1); color: var(--success); border: 1px solid rgba(46,204,113,0.3); }
    .msg.err { background: rgba(231,76,60,0.1); color: var(--error); border: 1px solid rgba(231,76,60,0.3); }
    .back-link { text-align: center; margin-top: var(--space-lg); }
    .back-link a { color: var(--smoke); text-decoration: none; font-size: 0.875rem; transition: color var(--transition-fast); }
    .back-link a:hover { color: var(--amber); }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>🔑 Reset Password</h1>
    <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>
    <div id="msg" class="msg"></div>
    <form id="resetForm" onsubmit="return handleForgot(event)">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <div class="back-link"><a href="/login.html">← Back to login</a></div>
  </div>
</div>
<script>
function showMsg(text, isErr) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + (isErr ? 'err' : 'ok');
  m.style.display = 'block';
}
async function handleForgot(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  try {
    var res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email })
    });
    var data = await res.json();
    showMsg(data.message || 'Check your email for a reset link.', false);
    document.getElementById('resetForm').style.display = 'none';
  } catch(err) {
    showMsg('Something went wrong. Please try again.', true);
  }
  return false;
}
</script>
</body>
</html>
