version: '3.8'
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: maikr-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: maikr_rag
      POSTGRES_USER: maikr_rag
      POSTGRES_PASSWORD: CHANGE_ME_TO_SECURE_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maikr_rag -d maikr_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
